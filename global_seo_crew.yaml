# Global SEO Pipeline Configuration
# All languages available on the blog

target_languages:
  - "en-US"      # English
  - "pl-PL"      # Polish
  - "it-IT"      # Italian
  - "de-DE"      # German
  - "fr-FR"      # French
  - "es-ES"      # Spanish
  - "th-TH"      # Thai
  - "ja-JP"      # Japanese
  - "zh-CN"      # Chinese (Simplified)
  - "pt-BR"      # Portuguese (Brazil)
  - "nl-NL"      # Dutch

# Language-specific settings for localization
language_settings:

<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Matcha Maya's Viewfinder Survival 3D | Holiday Video Camera</title>
<style>
        :root {
            --matcha: #A8C686;
            --matcha-dark: #6B8E23;
            --gold: #FFD700;
            --danger: #ff4757;
            --bg: #0f0f1a;
            --panel: rgba(26, 26, 46, 0.85);
            --text: #f0f0f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            perspective: 1000px; /* Enable 3D space */
        }
        
        #game-wrapper {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            background: var(--panel);
            border: 2px solid var(--matcha-dark);
            border-radius: 20px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        
        /* Glassmorphism UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(15, 15, 26, 0.95);
            z-index: 10;
            overflow-y: auto;
            border-radius: 20px;
        }
        .hidden { display: none !important; }
        
        h1 { 
            color: var(--matcha); 
            font-size: 2rem; 
            text-align: center; 
            margin-bottom: 10px; 
            text-shadow: 0 0 20px rgba(168,198,134,0.8);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 50% { text-shadow: 0 0 30px rgba(168,198,134,1); } }
        
        .btn {
            background: linear-gradient(135deg, var(--matcha-dark), var(--matcha));
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(107, 142, 35, 0.4);
        }
        .btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 25px rgba(107, 142, 35, 0.6); }
        .btn:active { transform: translateY(0) scale(0.95); }

        /* Setup Grid */
        .setup-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        .setup-item {
            background: rgba(255,255,255,0.03);
            border: 2px solid transparent;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        .setup-item:hover { background: rgba(255,255,255,0.08); transform: translateY(-2px); }
        .setup-item.selected { 
            border-color: var(--matcha); 
            background: rgba(168,198,134,0.15);
            box-shadow: 0 0 20px rgba(168,198,134,0.3);
        }

        /* HUD */
        #hud {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            z-index: 5;
            gap: 10px;
        }
        .stat-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        .stat-label { font-size: 0.7rem; color: #aaa; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .bar-container {
            width: 100%;
            height: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .bar-fill { height: 100%; transition: width 0.2s, background 0.5s; box-shadow: 0 0 10px currentColor; }
        #battery-fill { background: #4caf50; color: #4caf50; }
        #heat-fill { background: #ff9800; color: #ff9800; }
        #stability-fill { background: #2196f3; color: #2196f3; }
        #progress-fill { background: var(--gold); color: var(--gold); }

        /* Viewfinder */
        #viewfinder-container {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
            border-radius: 10px;
            margin: 0 15px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        /* Advanced Effects Overlays */
        .effect-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        #heat-overlay {
            background: radial-gradient(circle, transparent 40%, rgba(255, 0, 0, 0) 100%);
            transition: background 0.3s;
        }
        #glitch-overlay {
            opacity: 0;
            mix-blend-mode: screen;
        }
        .glitch-active #glitch-overlay {
            opacity: 1;
            animation: glitch-anim 0.2s infinite;
        }
        @keyframes glitch-anim {
            0% { transform: translate(0); filter: hue-rotate(0deg); }
            20% { transform: translate(-2px, 2px); filter: hue-rotate(90deg); }
            40% { transform: translate(-2px, -2px); filter: hue-rotate(180deg); }
            60% { transform: translate(2px, 2px); filter: hue-rotate(270deg); }
            80% { transform: translate(2px, -2px); filter: hue-rotate(360deg); }
            100% { transform: translate(0); filter: hue-rotate(0deg); }
        }

        #rec-indicator {
            position: absolute;
            top: 20px; left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            color: var(--danger);
            font-size: 1rem;
            opacity: 0;
            transition: opacity 0.2s;
            text-shadow: 0 0 10px var(--danger);
        }
        #rec-dot {
            width: 15px; height: 15px;
            background: var(--danger);
            border-radius: 50%;
            animation: blink 1s infinite;
            box-shadow: 0 0 10px var(--danger);
        }
        @keyframes blink { 50% { opacity: 0.3; } }

        /* Controls */
        #controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 20px;
            z-index: 5;
        }
        #record-btn {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: var(--danger);
            border: 5px solid white;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
        }
        #record-btn:active, #record-btn.recording {
            transform: scale(0.9);
            background: #cc0000;
            border-color: var(--gold);
            box-shadow: 0 0 30px var(--gold);
        }
        #stabilize-btn {
            padding: 15px 25px;
            border-radius: 40px;
            background: linear-gradient(135deg, #2196f3, #1565c0);
            border: none;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
            transition: all 0.1s;
        }
        #stabilize-btn:active { transform: scale(0.95); box-shadow: 0 2px 5px rgba(33, 150, 243, 0.4); }

        @media (max-width: 600px) {
            .setup-grid { grid-template-columns: 1fr; }
            h1 { font-size: 1.5rem; }
            #controls { gap: 15px; }
            #stabilize-btn { padding: 10px 15px; font-size: 0.9rem; }
        }
    </style>
<link href="/css/modern-styles.css" rel="stylesheet"/></head>
<body>
<div id="game-wrapper">
<!-- Main Menu -->
<div class="screen" id="menu-screen">
<h1>🍵 Matcha Maya's Viewfinder Survival </h1>
<p style="text-align: center; max-width: 500px; margin-bottom: 30px; color: #ccc;">
            Experience the ultimate travel filming challenge. Manage battery, heat, and stability across 10 global destinations.
        </p>
<button class="btn" onclick="showScreen('setup-screen')">Start New Shoot</button>
</div>
<!-- Setup Screen -->
<div class="screen hidden" id="setup-screen">
<h2 style="color: var(--gold); margin-bottom: 20px;">📍 Choose Destination</h2>
<div class="setup-grid" id="destinations-grid"></div>
<h2 style="color: var(--gold); margin: 20px 0;">📷 Choose Camera</h2>
<div class="setup-grid" id="cameras-grid"></div>
<button class="btn" disabled="" id="start-btn" onclick="startGame()" style="margin-top: 20px;">Start Recording</button>
<button class="btn" onclick="showScreen('menu-screen')" style="background: #444;">Back</button>
</div>
<!-- Game Screen -->
<div class="screen hidden" id="game-screen" style="padding: 0; justify-content: flex-start;">
<div class="glass-panel" id="hud" style="border-radius: 0 0 15px 15px; border-top: none;">
<div class="stat-bar">
<span class="stat-label">🔋 Battery</span>
<div class="bar-container"><div class="bar-fill" id="battery-fill" style="width: 100%"></div></div>
</div>
<div class="stat-bar">
<span class="stat-label">🔥 Heat</span>
<div class="bar-container"><div class="bar-fill" id="heat-fill" style="width: 0%"></div></div>
</div>
<div class="stat-bar">
<span class="stat-label">📉 Stability</span>
<div class="bar-container"><div class="bar-fill" id="stability-fill" style="width: 100%"></div></div>
</div>
<div class="stat-bar">
<span class="stat-label">🎯 Progress</span>
<div class="bar-container"><div class="bar-fill" id="progress-fill" style="width: 0%"></div></div>
</div>
</div>
<div id="viewfinder-container">
<canvas id="game-canvas"></canvas>
<!-- Advanced Effect Overlays -->
<div class="effect-overlay" id="heat-overlay"></div>
<div class="effect-overlay" id="glitch-overlay" style="background: linear-gradient(45deg, rgba(255,0,0,0.1), rgba(0,255,0,0.1), rgba(0,0,255,0.1));"></div>
<div id="rec-indicator"><div id="rec-dot"></div> REC</div>
<div id="location-overlay" style="position: absolute; bottom: 15px; right: 15px; background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 20px; font-size: 0.9rem; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2);"></div>
</div>
<div id="controls">
<button id="stabilize-btn" onmousedown="startStabilize()" onmouseup="stopStabilize()" ontouchend="stopStabilize()" ontouchstart="startStabilize()">HOLD TO<br/>STABILIZE</button>
<div id="record-btn" onmousedown="startRecord()" onmouseup="stopRecord()" ontouchend="stopRecord()" ontouchstart="startRecord()"></div>
</div>
</div>
<!-- Result Screen -->
<div class="screen hidden" id="result-screen">
<h2 id="result-title" style="font-size: 2rem; margin-bottom: 20px;">Shoot Complete!</h2>
<div class="glass-panel" style="padding: 25px; max-width: 500px; width: 100%; margin-bottom: 20px;">
<h3 style="color: var(--matcha); margin-bottom: 15px;">📊 Footage Stats</h3>
<div id="result-details" style="color: #ccc; line-height: 1.8;"></div>
</div>
<div class="glass-panel" style="padding: 25px; max-width: 500px; width: 100%; border-left: 4px solid var(--gold);">
<h3 style="color: var(--gold); margin-bottom: 10px;">🍵 Matcha Maya's Pro Tip</h3>
<p id="tip-text" style="color: #ccc; font-style: italic;"></p>
</div>
<button class="btn" onclick="showScreen('setup-screen')" style="margin-top: 20px;">Shoot Another Location</button>
</div>
</div>
<script>
// --- GAME DATA ---
const DESTINATIONS = [
    { id: 'bangkok', name: 'Bangkok Night Market', env: 'Hot & Crowded', heatMod: 1.5, coldMod: 1.0, wind: 0.2, color: '#ff6b6b', particle: 'neon' },
    { id: 'santorini', name: 'Santorini Cliff Sunset', env: 'Windy & Bright', heatMod: 1.0, coldMod: 1.0, wind: 0.8, color: '#4ecdc4', particle: 'wind' },
    { id: 'alps', name: 'Swiss Alps Ski Slope', env: 'Freezing & Bright', heatMod: 0.5, coldMod: 2.5, wind: 0.5, color: '#f7f7f7', particle: 'snow' },
    { id: 'maldives', name: 'Maldives Reef', env: 'Underwater', heatMod: 0.0, coldMod: 1.2, wind: 0.0, color: '#00b4d8', particle: 'bubble' },
    { id: 'tokyo', name: 'Tokyo Shibuya Crossing', env: 'Fast & Low Light', heatMod: 1.2, coldMod: 1.0, wind: 0.1, color: '#ff006e', particle: 'neon' },
    { id: 'patagonia', name: 'Patagonia Winds', env: 'Extreme Wind & Cold', heatMod: 0.8, coldMod: 2.0, wind: 1.0, color: '#90be6d', particle: 'wind' },
    { id: 'reykjavik', name: 'Reykjavik Aurora', env: 'Freezing & Dark', heatMod: 0.2, coldMod: 2.2, wind: 0.3, color: '#4361ee', particle: 'snow' },
    { id: 'bali', name: 'Bali Rice Terraces', env: 'Humid & Sunny', heatMod: 1.8, coldMod: 1.0, wind: 0.2, color: '#2a9d8f', particle: 'leaf' },
    { id: 'dubai', name: 'Dubai Desert Safari', env: 'Extreme Heat & Sand', heatMod: 2.5, coldMod: 1.0, wind: 0.4, color: '#e9c46a', particle: 'sand' },
    { id: 'newyork', name: 'NYC Street Night', env: 'Urban & Fast', heatMod: 1.0, coldMod: 1.2, wind: 0.3, color: '#8338ec', particle: 'neon' }
];

const CAMERAS = [
    { id: 'pocket3', name: 'DJI Osmo Pocket 3', battery: 100, heatRes: 0.8, stability: 0.9, tip: "Mechanical gimbal ignores wind, but small body heats up in desert sun." },
    { id: 'gopro13', name: 'GoPro Hero 13', battery: 120, heatRes: 1.2, stability: 0.85, tip: "Thermal king. Handles 4K in heat better than any action cam." },
    { id: 'sonyzv1', name: 'Sony ZV-1 II', battery: 90, heatRes: 0.6, stability: 0.4, tip: "Amazing low light, but no gimbal means you MUST stabilize heavily in wind." },
    { id: 'insta360x4', name: 'Insta360 X4', battery: 100, heatRes: 0.9, stability: 0.95, tip: "360 reframing saves shaky footage. Great battery, but 5.7K generates heat." }
];

// --- GAME STATE ---
let state = {
    screen: 'menu',
    dest: null,
    cam: null,
    battery: 100,
    heat: 0,
    stability: 100,
    progress: 0,
    isRecording: false,
    isStabilizing: false,
    gameOver: false,
    won: false,
    lastTime: 0,
    mouseX: 0,
    mouseY: 0
};

// --- 3D TILT EFFECT ---
document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 20;
    const y = (e.clientY / window.innerHeight - 0.5) * 20;
    document.getElementById('game-wrapper').style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
});

// --- UI FUNCTIONS ---
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    state.screen = id.replace('-screen', '');
    if (id === 'setup-screen') renderSetup();
}

function renderSetup() {
    document.getElementById('destinations-grid').innerHTML = DESTINATIONS.map(d => `
        <div class="setup-item ${state.dest?.id === d.id ? 'selected' : ''}" onclick="selectDest('${d.id}')">
            <h3 style="color: var(--matcha);">${d.name}</h3>
            <p style="font-size: 0.8rem; color: #aaa;">${d.env}</p>
        </div>
    `).join('');

    document.getElementById('cameras-grid').innerHTML = CAMERAS.map(c => `
        <div class="setup-item ${state.cam?.id === c.id ? 'selected' : ''}" onclick="selectCam('${c.id}')">
            <h3 style="color: var(--matcha);">${c.name}</h3>
            <p style="font-size: 0.75rem; color: #aaa;">Bat: ${c.battery} | Heat: ${c.heatRes}x | Stab: ${c.stability*100}%</p>
        </div>
    `).join('');

    document.getElementById('start-btn').disabled = !(state.dest && state.cam);
}

function selectDest(id) { state.dest = DESTINATIONS.find(d => d.id === id); renderSetup(); }
function selectCam(id) { state.cam = CAMERAS.find(c => c.id === id); renderSetup(); }

// --- GAME LOGIC ---
function startGame() {
    state.battery = state.cam.battery;
    state.heat = 0;
    state.stability = 100;
    state.progress = 0;
    state.isRecording = false;
    state.isStabilizing = false;
    state.gameOver = false;
    state.won = false;
    
    document.getElementById('location-overlay').innerText = `📍 ${state.dest.name}`;
    document.getElementById('rec-indicator').style.opacity = 0;
    document.getElementById('viewfinder-container').classList.remove('glitch-active');
    
    showScreen('game-screen');
    resizeCanvas();
    state.lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function startRecord() { if (!state.gameOver && !state.won) { state.isRecording = true; document.getElementById('rec-indicator').style.opacity = 1; document.getElementById('record-btn').classList.add('recording'); } }
function stopRecord() { state.isRecording = false; document.getElementById('rec-indicator').style.opacity = 0; document.getElementById('record-btn').classList.remove('recording'); }
function startStabilize() { state.isStabilizing = true; }
function stopStabilize() { state.isStabilizing = false; }

function gameLoop(timestamp) {
    if (state.screen !== 'game') return;
    const dt = (timestamp - state.lastTime) / 1000;
    state.lastTime = timestamp;
    
    updatePhysics(dt);
    renderCanvas();
    updateHUD();
    updateEffects();
    
    if (!state.gameOver && !state.won) requestAnimationFrame(gameLoop);
    else endGame();
}

function updatePhysics(dt) {
    const d = state.dest, c = state.cam;
    
    let drain = state.isRecording ? 2.5 : 0.5;
    drain *= d.coldMod;
    state.battery = Math.max(0, state.battery - drain * dt);
    
    if (state.isRecording) {
        let heatGen = 1.5 * (1 / c.heatRes);
        heatGen *= d.heatMod;
        state.heat = Math.min(100, state.heat + heatGen * dt);
    } else {
        state.heat = Math.max(0, state.heat - 3 * dt);
    }
    
    let targetStability = c.stability * 100;
    if (state.isStabilizing) targetStability = Math.min(100, targetStability + 30);
    targetStability -= (d.wind * 40);
    targetStability = Math.max(0, Math.min(100, targetStability));
    state.stability += (targetStability - state.stability) * 2 * dt;
    
    if (state.isRecording && state.stability > 20 && state.heat < 95) {
        state.progress = Math.min(100, state.progress + 5 * (state.stability / 100) * dt);
    }
    
    if (state.battery <= 0 || state.heat >= 100) { state.gameOver = true; state.won = false; }
    if (state.progress >= 100) { state.won = true; state.gameOver = true; }
}

function updateHUD() {
    document.getElementById('battery-fill').style.width = state.battery + '%';
    document.getElementById('battery-fill').style.background = state.battery < 20 ? 'var(--danger)' : '#4caf50';
    document.getElementById('heat-fill').style.width = state.heat + '%';
    document.getElementById('heat-fill').style.background = state.heat > 80 ? 'var(--danger)' : '#ff9800';
    document.getElementById('stability-fill').style.width = state.stability + '%';
    document.getElementById('stability-fill').style.background = state.stability < 30 ? 'var(--danger)' : '#2196f3';
    document.getElementById('progress-fill').style.width = state.progress + '%';
}

function updateEffects() {
    // Dynamic Heat Overlay
    const heatOverlay = document.getElementById('heat-overlay');
    heatOverlay.style.background = `radial-gradient(circle, transparent 40%, rgba(255, 0, 0, ${state.heat / 200}) 100%)`;
    
    // Glitch Effect
    const container = document.getElementById('viewfinder-container');
    if (state.heat > 85) container.classList.add('glitch-active');
    else container.classList.remove('glitch-active');
}

// --- CANVAS RENDERING WITH PARTICLES ---
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
    const container = document.getElementById('viewfinder-container');
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
}
window.addEventListener('resize', resizeCanvas);

class Particle {
    constructor(type, w, h) {
        this.type = type;
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.size = Math.random() * 3 + 1;
        this.speedY = type === 'snow' || type === 'sand' ? Math.random() * 2 + 1 : Math.random() * 1 - 0.5;
        this.speedX = type === 'wind' ? Math.random() * 5 + 2 : Math.random() * 1 - 0.5;
        this.life = 1;
    }
    update(w, h) {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.y > h) this.y = 0;
        if (this.x > w) this.x = 0;
    }
    draw(ctx) {
        ctx.fillStyle = this.type === 'snow' ? 'white' : this.type === 'sand' ? '#e9c46a' : this.type === 'neon' ? '#ff006e' : 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function renderCanvas() {
    const w = canvas.width, h = canvas.height;
    
    // Init particles
    if (particles.length === 0 || particles[0].type !== state.dest.particle) {
        particles = [];
        for(let i=0; i<50; i++) particles.push(new Particle(state.dest.particle, w, h));
    }
    
    const shakeIntensity = (100 - state.stability) / 10;
    const shakeX = (Math.random() - 0.5) * shakeIntensity;
    const shakeY = (Math.random() - 0.5) * shakeIntensity;
    
    ctx.save();
    ctx.translate(shakeX, shakeY);
    
    // Background Gradient
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, state.dest.color);
    grad.addColorStop(1, '#000');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    
    // Draw Particles
    particles.forEach(p => { p.update(w, h); p.draw(ctx); });
    
    // Simple Scenery
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    if (state.dest.id.includes('alps') || state.dest.id.includes('patagonia')) {
        ctx.beginPath(); ctx.moveTo(0, h); ctx.lineTo(w*0.3, h*0.4); ctx.lineTo(w*0.6, h); ctx.fill();
        ctx.beginPath(); ctx.moveTo(w*0.4, h); ctx.lineTo(w*0.8, h*0.3); ctx.lineTo(w, h); ctx.fill();
    } else {
        ctx.fillStyle = 'rgba(255,255,200,0.6)';
        ctx.beginPath(); ctx.arc(w*0.7, h*0.3, 40, 0, Math.PI*2); ctx.fill();
    }
    
    // Viewfinder Overlay
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    ctx.strokeRect(w*0.1, h*0.1, w*0.8, h*0.8);
    ctx.beginPath(); ctx.moveTo(w*0.45, h*0.5); ctx.lineTo(w*0.55, h*0.5); ctx.moveTo(w*0.5, h*0.45); ctx.lineTo(w*0.5, h*0.55); ctx.stroke();
    
    if (state.isRecording && Math.floor(performance.now() / 500) % 2 === 0) {
        ctx.fillStyle = 'rgba(255, 0, 0, 0.15)';
        ctx.fillRect(0, 0, w, h);
    }
    
    ctx.restore();
}

function endGame() {
    const title = document.getElementById('result-title');
    const details = document.getElementById('result-details');
    const tip = document.getElementById('tip-text');
    
    if (state.won) {
        title.innerText = '🎬 Perfect Shot Captured!';
        title.style.color = 'var(--gold)';
        details.innerHTML = `
            <p>📍 <strong>Location:</strong> ${state.dest.name}</p>
            <p>📷 <strong>Camera:</strong> ${state.cam.name}</p>
            <p>🔋 <strong>Battery Left:</strong> ${Math.round(state.battery)}%</p>
            <p>🔥 <strong>Max Heat:</strong> ${Math.round(state.heat)}%</p>
        `;
    } else {
        title.innerText = '❌ Shoot Failed!';
        title.style.color = 'var(--danger)';
        const reason = state.battery <= 0 ? 'Battery died mid-shot.' : 'Camera overheated and shut down.';
        details.innerHTML = `<p>${reason}</p><p>Progress reached: ${Math.round(state.progress)}%</p>`;
    }
    
    tip.innerText = state.cam.tip + " " + DESTINATIONS.find(d => d.id === state.dest.id).tip;
    showScreen('result-screen');
}
</script>
</body>
</html>

name: Update Matcha Maya AI Game Tips

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' # Runs on the 1st of every month

jobs:
  generate-tips:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install openai

      - name: Generate New AI Tips via DeepSeek
        run: |
          python << 'EOF'
          import os, openai, json, re

          client = openai.OpenAI(
              api_key=os.getenv("DEEPSEEK_API_KEY"),
              base_url=os.getenv("DEEPSEEK_BASE_URL", "https://api.deepseek.com/v1")
          )

          prompt = """
          You are Matcha Maya, an AI travel videography influencer. 
          Generate a JSON object of 4 new destination tips for an HTML5 game. 
          Destinations: "Tokyo", "Patagonia", "Reykjavik", "Bali".
          
          Format strictly as valid JSON:
          {
            "Tokyo": { "tip": "Short, punchy, 1-sentence tip mentioning a specific camera (e.g., Sony ZV-1 II) and a real-world condition (e.g., low light, crowds). End with '[Read Review]'.", "link": "/your-blog-slug-here/" },
            ...
          }
          Keep tips under 150 characters each. Make them sound like a funky AI influencer.
          """

          response = client.chat.completions.create(
              model=os.getenv("DEEPSEEK_MODEL", "deepseek-v4-flash"),
              messages=[{"role": "user", "content": prompt}],
              temperature=0.7
          )

          # Extract JSON from response
          text = response.choices[0].message.content
          json_match = re.search(r'\{.*\}', text, re.DOTALL)
          if json_match:
              new_tips = json.loads(json_match.group())
              with open("game/ai_tips.json", "w") as f:
                  json.dump(new_tips, f, indent=2)
              print("✅ Successfully generated new AI tips!")
          else:
              print("❌ Failed to parse JSON from DeepSeek response.")
          EOF

      - name: Commit Updated Tips to Game
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add game/ai_tips.json
          git diff --staged --quiet || git commit -m "chore(game): update Matcha Maya AI tips via DeepSeek [skip ci]"
          git push origin HEAD:main

name: Diagnose HTML damage (READ ONLY)

on:
  workflow_dispatch:

# Read-only at the workflow level.
# Even if a step tried to push, it would be rejected by the runner.
permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (no credentials retained)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run diagnostic
        run: python scripts/diagnose_html.py

      - name: Confirmation — nothing was modified
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Something modified the working tree — diagnostic was not read-only!"
            git status --porcelain
            exit 1
          fi
          echo "✓ Working tree unchanged. Diagnostic was fully read-only."

name: Internal Linking Audit

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run internal link audit
        run: python tools/check_internal_links.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-links-report
          path: link-audit-report.json

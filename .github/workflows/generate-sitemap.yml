name: Generate Sitemap

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sitemap:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://dawidmillenium-design.github.io/VideoCameraHoliday/
          path-to-root: .
          includes: |
            **/*.html
            **/*.htm
          excludes: |
            **/assets/**
            **/images/**
            404.html

      - name: Commit and push sitemap
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add sitemap.xml
          git diff --staged --quiet || git commit -m "Auto-update sitemap.xml"
          git push

name: SEO & Content Quality Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  seo-audit:
    name: Run SEO Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pyyaml

      - name: Create Fallback Script
        run: |
          cat > fallback_audit.py << 'ENDOFSCRIPT'
import json
report = {
    'status': 'warning',
    'message': 'Custom seo_audit.py not found.',
    'broken_links': 0,
    'canonical_mismatches': 0
}
with open('seo_report.json', 'w') as f:
    json.dump(report, f, indent=2)
print('Fallback report generated.')
ENDOFSCRIPT

      - name: Run SEO Audit Script (Non-Failing)
        id: seo_audit
        continue-on-error: true
        run: |
          echo "🔍 Starting SEO Audit..."
          
          if [ -f "scripts/seo_audit.py" ]; then
            echo "Running scripts/seo_audit.py..."
            python scripts/seo_audit.py || true
          else
            echo "️ scripts/seo_audit.py not found. Running fallback..."
            python fallback_audit.py
          fi
          
          if [ ! -f "seo_report.md" ]; then
            echo "# 📊 SEO Audit Report" > seo_report.md
            echo "✅ Audit completed." >> seo_report.md
          fi

      - name: Upload SEO Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-results
          path: |
            seo_report.json
            seo_report.md
          retention-days: 7

      - name: Post SEO Report to PR
        if: github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            ### 📊 SEO & Content Quality Audit Results
            
            The automated SEO audit has completed. 
            
            - **Workflow Status:** ${{ steps.seo_audit.outcome == 'success' && '✅ Passed' || '⚠️ Completed with Warnings' }}
            - **Next Steps:** Download the **"seo-audit-results"** artifact to see details.
          message-id: seo-audit-comment

name: SEO & Content Quality Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    continue-on-error: true  # ← Add this to prevent workflow failure
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run Internal Link Audit
        run: python scripts/seo_audit.py  # Or whatever your script is called
        
      - name: Upload SEO Report
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-report
          path: seo_report.json

name: SEO & Content Quality Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  seo-audit:
    name: Run SEO Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required to post comments on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pyyaml

      - name: Run SEO Audit Script (Non-Failing)
        id: seo_audit
        continue-on-error: true # ← CRITICAL: Prevents the workflow from failing the PR
        run: |
          echo "🔍 Starting SEO Audit..."
          
          # Run the existing script, but append '|| true' to force success even if it finds errors
          if [ -f "scripts/seo_audit.py" ]; then
            echo "Running scripts/seo_audit.py..."
            python scripts/seo_audit.py || true
          else
            echo "⚠️ scripts/seo_audit.py not found. Running fallback check..."
            python -c "
import json
report = {
    'status': 'warning',
    'message': 'Custom seo_audit.py not found. Please ensure the script exists in the scripts/ folder.',
    'broken_links': 0,
    'canonical_mismatches': 0
}
with open('seo_report.json', 'w') as f:
    json.dump(report, f, indent=2)
print('Fallback report generated.')
"
          fi
          
          # Ensure a markdown report exists for easy reading
          if [ ! -f "seo_report.md" ]; then
            echo "# 📊 SEO Audit Report" > seo_report.md
            echo "✅ Audit completed. Check the workflow artifacts for the detailed JSON report." >> seo_report.md
          fi

      - name: Upload SEO Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-results
          path: |
            seo_report.json
            seo_report.md
          retention-days: 7

      - name: Post SEO Report to PR
        if: github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            ### 📊 SEO & Content Quality Audit Results
            
            The automated SEO audit has completed. 
            
            - **Workflow Status:** ${{ steps.seo_audit.outcome == 'success' && '✅ Passed' || '⚠️ Completed with Warnings' }}
            - **Next Steps:** Click on the **"Summary"** tab of this workflow run and download the **"seo-audit-results"** artifact at the bottom to see the exact broken links and canonical mismatches.
            
            > *Note: This workflow is configured to never block merges, but high-priority warnings should be reviewed.*
          message-id: seo-audit-comment

name: SEO Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install cheerio axios

      - name: Run SEO audit
        run: node audit-canonical.js

      - name: Check for critical issues
        run: |
          if grep -q "Critical: [1-9]" audit-summary.txt; then
            echo "❌ Critical SEO issues found. Fix before merging."
            cat audit-summary.txt
            exit 1
          else
            echo "✅ No critical issues found."
          fi

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-report
          path: |
            audit-report.json
            audit-summary.txt

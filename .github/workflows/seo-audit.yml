name: SEO & Quality Audit

on:
  push:
    branches: [ main ]
    paths:
      - '**.html'
  pull_request:
    branches: [ main ]
    paths:
      - '**.html'
  workflow_dispatch:  # Allow manual trigger
  schedule:
    - cron: '0 0 * * 1'  # Run weekly on Monday at midnight

jobs:
  audit:
    runs-on: ubuntu-latest
    name: Run SEO & Quality Audit
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4
      
      - name: Run SEO Audit
        id: audit
        run: |
          python scripts/seo-audit.py
        env:
          OUTPUT_FORMAT: markdown
      
      - name: Read audit report
        id: report
        run: |
          REPORT=$(cat audit-report.md)
          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.report.outputs.report }}`;
            
            // Check if comment already exists
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('📊 SEO & Quality Audit Report')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            }
      
      - name: Upload audit report artifact
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-report
          path: audit-report.md
          retention-days: 30
      
      - name: Create issue for low scores
        if: steps.audit.outputs.average_score < 70
        uses: actions/github-script@v7
        with:
          script: |
            const avgScore = parseFloat('${{ steps.audit.outputs.average_score }}');
            const filesScanned = '${{ steps.audit.outputs.files_scanned }}';
            const errors = '${{ steps.audit.outputs.errors }}';
            
            // Check if similar issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'seo-audit'
            });
            
            const existingIssue = issues.data.find(issue => 
              issue.title.includes('Low SEO & Quality Scores')
            );
            
            const issueBody = `## ⚠️ Low SEO & Quality Scores Detected
            
            **Average Score:** ${avgScore.toFixed(1)}%
            **Files Scanned:** ${filesScanned}
            **Errors:** ${errors}
            
            The automated SEO and quality audit found that the average score is below 70%. 
            
            ### Recommended Actions:
            1. Review the detailed audit report in the workflow artifacts
            2. Focus on files with the lowest scores
            3. Address critical SEO issues (missing meta tags, alt text)
            4. Improve EEAT signals (author info, publication dates)
            5. Add more internal links and improve anchor text
            6. Fix HTML quality issues (semantic structure, accessibility)
            
            [View Full Audit Report](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            
            ---
            *This issue was automatically created by the SEO audit workflow.*`;
            
            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: issueBody
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ Low SEO & Quality Scores - Action Required',
                body: issueBody,
                labels: ['seo-audit', 'enhancement']
              });
            }
      
      - name: Close resolved issues
        if: steps.audit.outputs.average_score >= 70
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'seo-audit'
            });
            
            for (const issue of issues.data) {
              if (issue.title.includes('Low SEO & Quality Scores')) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: '✅ SEO scores have improved! The average score is now above 70%. Closing this issue.'
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
              }
            }

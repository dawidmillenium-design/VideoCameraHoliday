name: SEO & Content Quality Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml

      - name: Run Internal Link Audit
        run: |
          echo "Checking for broken links, orphans, and canonical mismatches..."
          python internal_link_audit.py

      - name: Run Hreflang Consistency Validator
        run: |
          echo "Checking hreflang tag consistency..."
          python scripts/validate_hreflang_consistency.py

      - name: Run Content-Quality Guardrail
        run: |
          echo "Checking internal link context for misleading or inaccurate claims..."
          python scripts/validate_link_context_quality.py

      - name: Check Git Formatting
        run: |
          echo "Checking for trailing whitespace and merge conflict markers..."
          git diff --check

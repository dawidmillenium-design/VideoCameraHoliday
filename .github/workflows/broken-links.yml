name: Broken Link Checker

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate internal links, fragments, sitemap, and canonicals
        run: python tools/check_internal_links.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-link-audit
          path: link-audit-report.json

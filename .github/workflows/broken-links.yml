+++ .github/workflows/broken-links.yml (修改后)
name: Broken Link Checker

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

# Prevent concurrent runs of this workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read
  actions: read

jobs:
  link-check:
    name: 🔗 Broken Link Checker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml || echo "⚠️ Optional dependencies not installed"

      - name: 🔍 Validate internal links, fragments, sitemap, and canonicals
        id: link-validation
        run: |
          echo "Starting internal link validation..."
          if [ -f "tools/check_internal_links.py" ]; then
            python tools/check_internal_links.py
            echo "✅ Link validation completed"
          else
            echo "::error::Link checker script not found at tools/check_internal_links.py"
            exit 1
          fi
        continue-on-error: true

      - name: 📊 Generate link audit report
        run: |
          echo "🔗 BROKEN LINK AUDIT REPORT" > link-audit-summary.txt
          echo "==========================" >> link-audit-summary.txt
          echo "Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> link-audit-summary.txt
          echo "Branch: ${{ github.ref_name }}" >> link-audit-summary.txt
          echo "Commit: ${{ github.sha }}" >> link-audit-summary.txt
          echo "" >> link-audit-summary.txt
          echo "Validation Results:" >> link-audit-summary.txt
          if [ -f "link-audit-report.json" ]; then
            echo "  ✅ Report generated: link-audit-report.json" >> link-audit-summary.txt
            # Extract summary from JSON if available
            python3 -c "import json; data=json.load(open('link-audit-report.json')); print(f\"  Total pages checked: {len(data.get('pages', []))}\")" 2>/dev/null || true
          else
            echo "  ⚠️ No report file generated" >> link-audit-summary.txt
          fi
          cat link-audit-summary.txt

      - name: 🔔 Check for broken links (external tool)
        id: external-check
        run: |
          echo "Running external broken link check..."
          # Only run on scheduled checks or manual triggers to avoid rate limits
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "External check enabled for ${{ github.event_name }} event"
            # Note: blc (broken-link-checker) requires Node.js
            # Using Python-based alternative instead
          else
            echo "Skipping external check for PR/push events to conserve API limits"
          fi

      - name: 📤 Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-link-audit-${{ github.run_id }}
          path: |
            link-audit-report.json
            link-audit-summary.txt
          retention-days: 30
          if-no-files-found: warn

      - name: 🔔 Notify on failure
        if: failure()
        run: |
          echo "::error::Broken Link Checker workflow failed!"
          echo "Workflow: ${{ github.workflow }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo ""
          echo "Please check the workflow logs for details."

          # Slack notification (if webhook is configured)
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"❌ Broken Link Checker FAILED in ${{ github.repository }}\\nBranch: ${{ github.ref_name }}\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "${{ secrets.SLACK_WEBHOOK_URL }}" || echo "Slack notification failed"
          fi

          # Email notification via GitHub's built-in notifications
          # Configure email notifications in repository Settings > Notifications

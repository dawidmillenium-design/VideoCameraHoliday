name: Inject Design B Across All HTML Files

on:
  # Manual trigger — recommended for first runs
  workflow_dispatch:
  
  # Auto-trigger when the template or script changes
  push:
    branches:
      - main
    paths:
      - 'templates/design-b.html'
      - 'scripts/inject_design.py'
      - '.github/workflows/inject-design.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml
      
      - name: Run injection script
        run: python scripts/inject_design.py
      
      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected."
            git diff --stat
          fi
      
      - name: Commit and push changes
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: inject Design B header/footer across all HTML files [skip ci]"
          git push
      
      - name: Summary
        run: |
          echo "## Design B Injection Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.changed }}" == "true" ]; then
            echo "✅ Changes committed and pushed." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No changes needed — files already up to date." >> $GITHUB_STEP_SUMMARY
          fi

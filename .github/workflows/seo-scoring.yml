name: On-Page SEO Scoring (DeepSeek)

on:
  pull_request:
    paths:
      - '**.md'
      - '**.html'
      - '_posts/**'
      - 'reviews/**'
      - 'destinations/**'

jobs:
  seo-score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **.md
            **.html

      - name: Run SEO Scorer
        id: seo-scorer
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "Analyzing $file..."
            python seo_scorer.py "$file" || true
          done

      - name: Post SEO Score to PR
        if: steps.changed-files.outputs.any_changed == 'true' && steps.seo-scorer.outputs.seo_score != ''
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            ### 📊 DeepSeek On-Page SEO Analysis
            
            **SEO Score:** `${{ steps.seo-scorer.outputs.seo_score }}/100`  
            **Word Count:** `${{ steps.seo-scorer.outputs.seo_word_count }}` words  
            **Keyword Density:** `${{ steps.seo-scorer.outputs.seo_density }}`  
            
            **🎯 Missing Semantic Keywords:**  
            `${{ steps.seo-scorer.outputs.seo_missing_keywords }}`
            
            **💡 Actionable Recommendations:**  
            ${{ steps.seo-scorer.outputs.seo_recommendations }}
            
            > *Powered by DeepSeek API | Mimics SurferSEO/Scalenut logic*
          message-id: seo-analysis-comment

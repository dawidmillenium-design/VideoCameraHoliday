name: Apply shared site shell
on:
  push:
    branches: [codex/shared-navigation-footer]
    paths: [.github/workflows/apply-shared-site-shell.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply navigation and footer
        run: |
          mkdir -p assets tools
          echo '' | base64 -d > tools/apply_site_shell.py
          echo '' | base64 -d > assets/site-shell.css
          echo '' | base64 -d > assets/site-shell.js
          python3 tools/apply_site_shell.py
          git rm .github/workflows/apply-shared-site-shell.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply shared navigation and footer sitewide"
          git push

name: 🤖 AI Article Generator

on:
  workflow_dispatch:
    inputs:
      article_topic:
        description: 'Article topic/title (e.g., "Best Camera for Thailand Travel 2026")'
        required: true
        default: 'DJI Osmo Pocket 4P vs GoPro Hero 13: Ultimate Travel Comparison'
      target_language:
        description: 'Target language code (e.g., en-US, th-TH, pl-PL)'
        required: true
        default: 'en-US'
      word_count:
        description: 'Target word count'
        required: false
        default: '2000'
      content_type:
        description: 'Content type'
        required: true
        default: 'comparison'
        type: choice
        options:
          - review
          - comparison
          - buying-guide
          - how-to
          - destination-guide
      generate_html:
        description: 'Generate HTML with schema markup'
        required: false
        default: 'true'
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  DEEPSEEK_MODEL: 'deepseek-chat'

jobs:
  generate-article:
    name: Generate AI Article
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # Changed
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai python-dotenv beautifulsoup4 lxml requests

      - name: 🔐 Validate API Key
        run: |
          if [ -z "${{ secrets.DEEPSEEK_API_KEY }}" ]; then
            echo "::error::DEEPSEEK_API_KEY secret is not set"
            exit 1
          fi
          echo "✅ API key found"

      - name:  Generate Article Content
        id: generate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ARTICLE_TOPIC: ${{ github.event.inputs.article_topic }}
          TARGET_LANGUAGE: ${{ github.event.inputs.target_language }}
          WORD_COUNT: ${{ github.event.inputs.word_count }}
          CONTENT_TYPE: ${{ github.event.inputs.content_type }}
        run: |
          python scripts/generate_article.py

      - name: 🌐 Generate Multi-Language Versions (Optional)
        if: github.event.inputs.target_language == 'en-US'
        run: |
          echo "Generating additional language versions..."
          # Add logic here to generate es-ES, fr-FR, de-DE, etc.
          python scripts/generate_translations.py || echo "Translation script not found"

      - name:  Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: 💾 Commit Generated Article
        run: |
          git add generated-content/
          if ! git diff --staged --quiet; then
            git commit -m "feat: generate AI article - ${{ github.event.inputs.article_topic }} [skip ci]"
            git push origin main
            echo "✅ Article committed and pushed"
          else
            echo "⚠️ No changes to commit"
          fi

      - name: 📤 Upload Generated Content
        uses: actions/upload-artifact@v4
        with:
          name: "generated-article-${{ github.run_number }}"
          path: generated-content/
          retention-days: 30

      - name: ✅ Success Summary
        run: |
          echo "## 🎉 Article Generation Complete!"
          echo ""
          echo "**Topic:** ${{ github.event.inputs.article_topic }}"
          echo "**Language:** ${{ github.event.inputs.target_language }}"
          echo "**Word Count Target:** ${{ github.event.inputs.word_count }}"
          echo "**Content Type:** ${{ github.event.inputs.content_type }}"
          echo ""
          echo "📁 Check the 'generated-content/' directory for the article."

name: 🧠 AI SEO Intelligence System

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'AI Mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - content-optimize
          - keyword-research
          - blog-generate
          - link-optimize
          - predictive-audit
      creativity:
        description: 'Creativity Level (0.0 - 1.0)'
        required: false
        default: '0.7'
        type: number
        min: 0
        max: 1
        step: 0.1

  schedule:
    # Daily optimization
    - cron: '0 3 * * *'
    # Weekly deep analysis
    - cron: '0 6 * * 1'
    # Monthly full strategy
    - cron: '0 8 1 * *'

  push:
    branches: [ main ]
    paths:
      - '**/*.html'
      - '**/*.md'
      - '**/*.txt'
      - '**/*.py'

permissions:
  contents: write
  actions: read
  pages: read
  pull-requests: write
  issues: write

env:
  CREATIVITY: ${{ github.event.inputs.creativity || '0.7' }}
  SITE_URL: 'https://dawidmillenium-design.github.io/VideoCameraHoliday'
  SITE_NAME: 'VideoCameraHoliday'
  DEEPSEEK_MODEL: 'deepseek-chat'

jobs:
  # ========================================================================
  # JOB 1: AI CONTENT OPTIMIZER
  # ========================================================================
  content-optimizer:
    name: 📝 AI Content Optimizer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install \
            openai \
            beautifulsoup4 \
            lxml \
            requests \
            markdownify \
            sentence-transformers \
            scikit-learn \
            numpy \
            pandas \
            tiktoken \
            python-frontmatter
          echo "✅ Dependencies installed"

      - name: 🧠 Run AI Content Optimizer (DeepSeek)
        id: ai-content
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 - << 'EOF'
          import os
          import sys
          import json
          import re
          from pathlib import Path
          from datetime import datetime
          from bs4 import BeautifulSoup
          from openai import OpenAI
          
          # ================================================================
          # DEEPSEEK AI SETUP
          # ================================================================
          
          API_KEY = os.getenv('DEEPSEEK_API_KEY')
          if not API_KEY:
              print("❌ ERROR: DEEPSEEK_API_KEY not set")
              print("Please add your DeepSeek API key to GitHub Secrets")
              sys.exit(1)
          
          # Initialize DeepSeek client (uses OpenAI-compatible API)
          client = OpenAI(
              api_key=API_KEY,
              base_url="https://api.deepseek.com/v1"
          )
          
          MODEL = os.getenv('DEEPSEEK_MODEL', 'deepseek-chat')
          CREATIVITY = float(os.getenv('CREATIVITY', '0.7'))
          SITE_NAME = os.getenv('SITE_NAME', 'VideoCameraHoliday')
          SITE_URL = os.getenv('SITE_URL', 'https://dawidmillenium-design.github.io/VideoCameraHoliday')
          
          print(f"🧠 Initializing DeepSeek AI")
          print(f"📊 Model: {MODEL}")
          print(f"🎨 Creativity: {CREATIVITY}")
          
          # ================================================================
          # AI HELPER FUNCTION
          # ================================================================
          
          def ask_deepseek(prompt, system_prompt=None):
              """Send prompt to DeepSeek and get response"""
              try:
                  response = client.chat.completions.create(
                      model=MODEL,
                      messages=[
                          {"role": "system", "content": system_prompt or "You are an expert SEO consultant and content strategist."},
                          {"role": "user", "content": prompt}
                      ],
                      temperature=CREATIVITY,
                      max_tokens=4096
                  )
                  return response.choices[0].message.content
              except Exception as e:
                  print(f"❌ DeepSeek API Error: {e}")
                  return f"[AI ERROR] {e}"
          
          # ================================================================
          # 1. ANALYZE ALL PAGES
          # ================================================================
          
          print("\n📊 Analyzing all pages...")
          
          pages = []
          for root, dirs, files in os.walk('.'):
              if any(x in root for x in ['.git', 'node_modules', 'assets', 'images']):
                  continue
              for f in files:
                  if f.endswith('.html') or f.endswith('.htm'):
                      filepath = os.path.join(root, f)
                      try:
                          with open(filepath, 'r', encoding='utf-8') as file:
                              content = file.read()
                      except:
                          continue
                      
                      soup = BeautifulSoup(content, 'html.parser')
                      
                      title = soup.find('title')
                      meta_desc = soup.find('meta', attrs={'name': 'description'})
                      h1 = soup.find('h1')
                      h2s = soup.find_all('h2')
                      h3s = soup.find_all('h3')
                      body = soup.find('body')
                      
                      page_data = {
                          'url': filepath.replace('./', '').replace('index.html', '').replace('.html', '') or '/',
                          'file': filepath,
                          'title': title.text.strip() if title else '',
                          'description': meta_desc.get('content', '') if meta_desc else '',
                          'h1': h1.text.strip() if h1 else '',
                          'h2s': [h.text.strip() for h in h2s[:5]],
                          'h3s': [h.text.strip() for h in h3s[:5]],
                          'content': body.get_text(' ', strip=True)[:2000] if body else ''
                      }
                      pages.append(page_data)
          
          print(f"✅ Found {len(pages)} pages to analyze")
          
          # ================================================================
          # 2. AI CONTENT OPTIMIZATION
          # ================================================================
          
          print("\n🧠 Running AI Content Optimization with DeepSeek...")
          
          optimization_results = []
          
          # Limit to top pages to manage API costs
          pages_to_optimize = pages[:10]
          
          for i, page in enumerate(pages_to_optimize, 1):
              print(f"\n📝 [{i}/{len(pages_to_optimize)}] Optimizing: {page['url']}")
              
              prompt = f"""
              Analyze this page and provide SEO optimization suggestions:
              
              URL: {page['url']}
              Current Title: {page['title'] or '(empty)'}
              Current Description: {page['description'] or '(empty)'}
              H1: {page['h1'] or '(empty)'}
              H2s: {', '.join(page['h2s']) if page['h2s'] else '(none)'}
              Content Preview: {page['content'][:800]}...
              
              Provide a JSON response with these exact keys:
              {{
                  "optimized_title": "2 title options, choose the best one",
                  "optimized_description": "2 description options, choose the best one",
                  "heading_fixes": ["fix suggestion 1", "fix suggestion 2"],
                  "content_tips": ["tip 1", "tip 2", "tip 3"],
                  "keywords": ["keyword1", "keyword2", "keyword3", "keyword4", "keyword5"],
                  "internal_links": ["suggested page 1", "suggested page 2"],
                  "readability": "readability improvement suggestion"
              }}
              
              Only respond with valid JSON, no other text.
              """
              
              response = ask_deepseek(prompt)
              
              try:
                  # Try to parse as JSON
                  optimized = json.loads(response)
                  optimization_results.append({
                      'url': page['url'],
                      'original': {
                          'title': page['title'],
                          'description': page['description']
                      },
                      'optimized': optimized
                  })
                  print(f"✅ Optimization complete for {page['url']}")
              except json.JSONDecodeError:
                  # Fallback: store raw response
                  optimization_results.append({
                      'url': page['url'],
                      'raw_response': response
                  })
                  print(f"⚠️ Could not parse JSON for {page['url']}")
          
          # Save optimization results
          with open('ai-optimization-results.json', 'w') as f:
              json.dump(optimization_results, f, indent=2)
          
          print(f"\n✅ Optimized {len(optimization_results)} pages")
          
          # ================================================================
          # 3. AI KEYWORD RESEARCH
          # ================================================================
          
          print("\n🔍 Running AI Keyword Research with DeepSeek...")
          
          # Get all content for keyword analysis
          all_content = ' '.join([p['content'] for p in pages[:20]])
          all_titles = ' '.join([p['title'] for p in pages if p['title']])
          
          keyword_prompt = f"""
          Analyze this camera review website and generate a comprehensive keyword strategy:
          
          Site: {SITE_NAME}
          URL: {SITE_URL}
          
          Topics found:
          {all_titles[:1000]}
          
          Content sample:
          {all_content[:1000]}
          
          Generate a JSON response with these exact keys:
          {{
              "primary_keywords": ["keyword1", "keyword2", "keyword3", "keyword4", "keyword5"],
              "long_tail_keywords": ["long tail 1", "long tail 2", "long tail 3"],
              "topics": ["topic 1", "topic 2", "topic 3", "topic 4", "topic 5"],
              "competitor_keywords": ["comp keyword 1", "comp keyword 2"],
              "content_gaps": ["gap 1", "gap 2", "gap 3"],
              "estimated_search_volume": {{
                  "keyword1": "1000-5000",
                  "keyword2": "500-1000"
              }}
          }}
          
          Only respond with valid JSON, no other text.
          """
          
          keyword_response = ask_deepseek(keyword_prompt)
          
          try:
              keywords = json.loads(keyword_response)
              with open('ai-keyword-research.json', 'w') as f:
                  json.dump(keywords, f, indent=2)
              print(f"✅ Found {len(keywords.get('primary_keywords', []))} primary keywords")
          except json.JSONDecodeError:
              with open('ai-keyword-research.md', 'w') as f:
                  f.write(f"# Keyword Research\n\n{keyword_response}")
              print("⚠️ Keyword research saved as markdown")
          
          # ================================================================
          # 4. GENERATE BLOG POST IDEAS
          # ================================================================
          
          print("\n📝 Generating blog post ideas with DeepSeek...")
          
          blog_prompt = f"""
          Based on this camera review website, generate 10 SEO-optimized blog post ideas:
          
          Site: {SITE_NAME}
          URL: {SITE_URL}
          
          Current topics: {', '.join([p['h1'] for p in pages[:10] if p['h1']])[:500]}
          
          Generate a JSON array with these keys for each idea:
          [
              {{
                  "title": "SEO-optimized title",
                  "target_keywords": ["kw1", "kw2"],
                  "outline": ["point 1", "point 2", "point 3", "point 4", "point 5"],
                  "why_ranks": "why this would rank well",
                  "estimated_words": 1200
              }}
          ]
          
          Only respond with valid JSON array, no other text.
          """
          
          blog_response = ask_deepseek(blog_prompt)
          
          try:
              blog_ideas = json.loads(blog_response)
              with open('ai-blog-ideas.json', 'w') as f:
                  json.dump(blog_ideas, f, indent=2)
              print(f"✅ Generated {len(blog_ideas)} blog ideas")
          except json.JSONDecodeError:
              with open('ai-blog-ideas.md', 'w') as f:
                  f.write(f"# Blog Post Ideas\n\n{blog_response}")
              print("⚠️ Blog ideas saved as markdown")
          
          # ================================================================
          # 5. GENERATE SUMMARY REPORT
          # ================================================================
          
          print("\n📊 Generating AI Summary Report...")
          
          summary = {
              'timestamp': datetime.now().isoformat(),
              'pages_analyzed': len(pages),
              'pages_optimized': len(optimization_results),
              'keywords_found': len(keywords.get('primary_keywords', [])) if 'keywords' in locals() else 0,
              'blog_ideas': len(blog_ideas) if 'blog_ideas' in locals() else 0,
              'provider': 'DeepSeek',
              'model': MODEL
          }
          
          with open('ai-seo-summary.json', 'w') as f:
              json.dump(summary, f, indent=2)
          
          # Markdown report
          md = f"""# 🧠 AI SEO Intelligence Report

          **Generated:** {datetime.now().isoformat()}
          **Site:** {SITE_NAME}
          **AI Provider:** DeepSeek
          **Model:** {MODEL}
          
          ## 📊 Summary
          
          | Metric | Value |
          |--------|-------|
          | Pages Analyzed | {summary['pages_analyzed']} |
          | Pages Optimized | {summary['pages_optimized']} |
          | Keywords Found | {summary['keywords_found']} |
          | Blog Ideas | {summary['blog_ideas']} |
          
          ## 🎯 Top Recommendations
          
          """
          
          # Add optimization suggestions
          for i, result in enumerate(optimization_results[:5], 1):
              md += f"\n### Page {i}: {result['url']}\n"
              if 'optimized' in result:
                  opt = result['optimized']
                  md += f"- **Title:** {opt.get('optimized_title', 'N/A')}\n"
                  md += f"- **Description:** {opt.get('optimized_description', 'N/A')}\n"
                  md += f"- **Keywords:** {', '.join(opt.get('keywords', [])[:3])}\n"
              else:
                  md += f"```\n{result.get('raw_response', 'N/A')[:300]}...\n```\n"
          
          with open('ai-seo-report.md', 'w') as f:
              f.write(md)
          
          print("✅ AI SEO report generated")
          print("\n🎉 AI Content Optimization Complete!")
          
          EOF

      - name: 📤 Upload AI Reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ai-seo-reports-${{ github.run_number }}
          path: |
            ai-*.json
            ai-*.md
          retention-days: 90

  # ========================================================================
  # JOB 2: SMART INTERNAL LINKING ENGINE
  # ========================================================================
  smart-linking:
    name: 🔗 Smart Internal Link Engine
    needs: [content-optimizer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: |
          pip install beautifulsoup4 lxml networkx scikit-learn numpy

      - name: 🔗 Build Smart Link Graph
        run: |
          python3 - << 'EOF'
          import os
          import re
          import json
          import networkx as nx
          from bs4 import BeautifulSoup
          from collections import defaultdict
          
          print("🔗 Building Smart Internal Link Engine...")
          
          # Load AI-generated keywords
          keywords = []
          if os.path.exists('ai-keyword-research.json'):
              with open('ai-keyword-research.json', 'r') as f:
                  kw_data = json.load(f)
                  keywords = kw_data.get('primary_keywords', []) + kw_data.get('long_tail_keywords', [])
          
          # Find all HTML files
          html_files = []
          for root, dirs, files in os.walk('.'):
              if any(x in root for x in ['.git', 'node_modules', 'assets', 'images']):
                  continue
              for f in files:
                  if f.endswith('.html'):
                      html_files.append(os.path.join(root, f))
          
          print(f"📊 Analyzing {len(html_files)} pages...")
          
          # Extract content and build graph
          graph = nx.DiGraph()
          pages_data = {}
          
          for filepath in html_files:
              try:
                  with open(filepath, 'r', encoding='utf-8') as f:
                      content = f.read()
              except:
                  continue
              
              soup = BeautifulSoup(content, 'html.parser')
              url = filepath.replace('./', '').replace('index.html', '').replace('.html', '') or '/'
              
              # Extract text
              text = soup.get_text(' ', strip=True)
              title = soup.find('title')
              h1 = soup.find('h1')
              
              pages_data[url] = {
                  'file': filepath,
                  'title': title.text.strip() if title else '',
                  'h1': h1.text.strip() if h1 else '',
                  'text': text[:1000],
                  'links': []
              }
              
              # Extract existing links
              for a in soup.find_all('a', href=True):
                  href = a['href']
                  if href and not href.startswith(('http://', 'https://', 'mailto:', 'tel:', '#')):
                      if href.endswith('.html') or href.endswith('/') or '.' not in href:
                          clean_href = href.split('?')[0].split('#')[0]
                          if clean_href.endswith('.html'):
                              clean_href = clean_href[:-5]
                          if clean_href.endswith('/'):
                              clean_href = clean_href[:-1]
                          if not clean_href.startswith('/'):
                              clean_href = '/' + clean_href
                          pages_data[url]['links'].append(clean_href)
                          graph.add_edge(url, clean_href)
          
          print(f"✅ Graph built with {graph.number_of_nodes()} nodes and {graph.number_of_edges()} edges")
          
          # Find orphan pages
          all_pages = set(pages_data.keys())
          linked_pages = set()
          for links in pages_data.values():
              linked_pages.update([l for l in links['links'] if l in all_pages])
          
          orphan_pages = all_pages - linked_pages - {'/'}
          
          print(f"⚠️ Found {len(orphan_pages)} orphan pages")
          
          # Calculate PageRank
          try:
              pagerank = nx.pagerank(graph)
              top_pages = sorted(pagerank.items(), key=lambda x: x[1], reverse=True)[:10]
              print(f"\n🏆 Top pages by importance:")
              for page, score in top_pages:
                  print(f"  {page}: {score:.3f}")
          except:
              print("⚠️ Could not calculate PageRank")
          
          # Generate smart linking suggestions
          suggestions = []
          for orphan in orphan_pages:
              if orphan in pages_data and pages_data[orphan]['text']:
                  orphan_text = pages_data[orphan]['text']
                  for page, data in pages_data.items():
                      if page != orphan and page != '/' and data['text']:
                          if any(kw.lower() in orphan_text.lower() and kw.lower() in data['text'].lower() for kw in keywords[:5]):
                              suggestions.append({
                                  'from': page,
                                  'to': orphan,
                                  'reason': "Related topic"
                              })
                              break
          
          # Save linking suggestions
          result = {
              'total_pages': len(pages_data),
              'total_links': graph.number_of_edges(),
              'orphan_pages': list(orphan_pages)[:50],
              'top_pages': top_pages if 'top_pages' in locals() else [],
              'link_suggestions': suggestions[:20]
          }
          
          with open('smart-linking-report.json', 'w') as f:
              json.dump(result, f, indent=2)
          
          # Generate markdown report
          md = f"""# 🔗 Smart Internal Linking Report

          ## 📊 Summary
          - **Total Pages:** {len(pages_data)}
          - **Total Links:** {graph.number_of_edges()}
          - **Orphan Pages:** {len(orphan_pages)}
          - **Link Suggestions:** {len(suggestions)}

          ## 🎯 Top Pages (PageRank)
          
          """
          if 'top_pages' in locals():
              for page, score in top_pages:
                  md += f"- **{page}:** {score:.3f}\n"
          
          md += f"""
          ## ⚠️ Orphan Pages

          {', '.join(list(orphan_pages)[:20]) if orphan_pages else 'None found! 🎉'}

          ## 💡 Link Suggestions

          """
          for s in suggestions[:10]:
              md += f"- From `{s['from']}` → `{s['to']}`: {s['reason']}\n"
          
          with open('smart-linking-report.md', 'w') as f:
              f.write(md)
          
          print("✅ Smart linking report generated!")
          EOF

      - name: 📤 Upload Linking Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smart-linking-report-${{ github.run_number }}
          path: |
            smart-linking-report.json
            smart-linking-report.md
          retention-days: 90

  # ========================================================================
  # JOB 3: AUTO-APPLY AI FIXES
  # ========================================================================
    # ========================================================================
  # JOB 3: AUTO-APPLY AI FIXES
  # ========================================================================
  apply-fixes:
    name: 🔧 Apply AI Fixes
    needs: [content-optimizer, smart-linking]
    if: github.event.inputs.mode == 'full' || github.event.inputs.mode == 'content-optimize'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install beautifulsoup4 lxml
          echo "✅ Dependencies installed"

      - name: 🔧 Apply AI fixes
        run: |
          python3 - << 'EOF'
          import os
          import json
          import sys
          from datetime import datetime
          from bs4 import BeautifulSoup
          
          print("🔧 Applying AI fixes...")
          
          if not os.path.exists('ai-optimization-results.json'):
              print("⚠️ No optimization results found")
              sys.exit(0)
          
          with open('ai-optimization-results.json', 'r') as f:
              optimizations = json.load(f)
          
          fixes_applied = []
          
          for opt in optimizations:
              if 'optimized' not in opt:
                  continue
              
              url = opt['url']
              filepath = url if url != '/' else 'index.html'
              if not filepath.endswith('.html'):
                  if filepath == '':
                      filepath = 'index.html'
                  else:
                      filepath = f"{filepath}.html"
              
              if not os.path.exists(filepath):
                  # Try to find the file
                  for root, dirs, files in os.walk('.'):
                      if filepath in files:
                          filepath = os.path.join(root, filepath)
                          break
                  else:
                      print(f"⚠️ Could not find file for {url}")
                      continue
              
              try:
                  with open(filepath, 'r', encoding='utf-8') as f:
                      content = f.read()
              except:
                  continue
              
              soup = BeautifulSoup(content, 'html.parser')
              changes = []
              
              # Fix title
              if opt['optimized'].get('optimized_title'):
                  title_tag = soup.find('title')
                  new_title = opt['optimized']['optimized_title']
                  if title_tag:
                      old_title = title_tag.text
                      title_tag.string = new_title
                      if old_title != new_title:
                          changes.append(f"Title updated")
                  else:
                      # Add title tag
                      new_tag = soup.new_tag('title')
                      new_tag.string = new_title
                      if soup.head:
                          soup.head.append(new_tag)
                          changes.append(f"Title added")
              
              # Fix description
              if opt['optimized'].get('optimized_description'):
                  meta = soup.find('meta', attrs={'name': 'description'})
                  new_desc = opt['optimized']['optimized_description']
                  if meta:
                      old_desc = meta.get('content', '')
                      meta['content'] = new_desc
                      if old_desc != new_desc:
                          changes.append(f"Description updated")
                  else:
                      new_meta = soup.new_tag('meta')
                      new_meta['name'] = 'description'
                      new_meta['content'] = new_desc
                      if soup.head:
                          soup.head.append(new_meta)
                          changes.append(f"Description added")
              
              if changes:
                  with open(filepath, 'w', encoding='utf-8') as f:
                      f.write(str(soup))
                  fixes_applied.append({
                      'file': filepath,
                      'changes': changes
                  })
                  print(f"✅ Applied fixes to {filepath}")
          
          # Save fix report
          report = {
              'timestamp': datetime.now().isoformat(),
              'fixes_applied': len(fixes_applied),
              'details': fixes_applied
          }
          
          with open('ai-fixes-applied.json', 'w') as f:
              json.dump(report, f, indent=2)
          
          print(f"\n📊 Applied {len(fixes_applied)} fixes across {len(fixes_applied)} files")
          EOF

      - name: 💾 Commit fixes
        if: always()
        run: |
          git config user.name "AI SEO Bot"
          git config user.email "ai-seo-bot@github.com"
          git add .
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 AI: Auto-apply SEO optimizations [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Fixes committed"
          fi

  # ========================================================================
  # JOB 4: GENERATE AI KNOWLEDGE BASE
  # ========================================================================
  knowledge-base:
    name: 📚 Build Knowledge Base
    needs: [content-optimizer, smart-linking]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📚 Build knowledge base
        run: |
          python3 - << 'EOF'
          import os
          import json
          import hashlib
          from datetime import datetime
          
          print("📚 Building AI Knowledge Base...")
          
          knowledge = {
              'site': 'VideoCameraHoliday',
              'timestamp': datetime.now().isoformat(),
              'provider': 'DeepSeek',
              'pages': [],
              'keywords': [],
              'optimizations': []
          }
          
          # Load all reports
          for file in ['ai-optimization-results.json', 'smart-linking-report.json', 'ai-keyword-research.json']:
              if os.path.exists(file):
                  with open(file, 'r') as f:
                      try:
                          data = json.load(f)
                          if 'optimization' in file:
                              knowledge['optimizations'] = data
                          elif 'keyword' in file:
                              knowledge['keywords'] = data
                          else:
                              knowledge['pages'] = data
                      except:
                          pass
          
          # Save knowledge base
          with open('ai-knowledge-base.json', 'w') as f:
              json.dump(knowledge, f, indent=2)
          
          print(f"✅ Knowledge base built")
          EOF

      - name: 📤 Upload Knowledge Base
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ai-knowledge-base-${{ github.run_number }}
          path: |
            ai-knowledge-base.json
          retention-days: 30

  # ========================================================================
  # JOB 5: AI DASHBOARD
  # ========================================================================
  dashboard:
    name: 📊 AI SEO Dashboard
    needs: [content-optimizer, smart-linking, knowledge-base]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📊 Generate AI Dashboard
        run: |
          python3 - << 'EOF'
          import os
          import json
          from datetime import datetime
          
          # Load all data
          data = {}
          for file in ['ai-seo-summary.json', 'ai-optimization-results.json', 'smart-linking-report.json', 'ai-keyword-research.json']:
              if os.path.exists(file):
                  with open(file, 'r') as f:
                      try:
                          data[file.replace('.json', '')] = json.load(f)
                      except:
                          pass
          
          # Get stats
          pages = data.get('ai-optimization-results', [])
          keywords = data.get('ai-keyword-research', {})
          links = data.get('smart-linking-report', {})
          
          primary_kw = keywords.get('primary_keywords', [])
          long_tail = keywords.get('long_tail_keywords', [])
          
          html = f'''<!DOCTYPE html>
          <html>
          <head>
              <title>🧠 AI SEO Dashboard</title>
              <meta charset="utf-8">
              <style>
                  * {{ margin: 0; padding: 0; box-sizing: border-box; }}
                  body {{
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
                      color: #e0e0e0;
                      padding: 20px;
                      min-height: 100vh;
                  }}
                  .container {{ max-width: 1400px; margin: 0 auto; }}
                  .header {{
                      text-align: center;
                      padding: 40px 20px;
                      background: rgba(255,255,255,0.05);
                      border-radius: 20px;
                      margin-bottom: 30px;
                      backdrop-filter: blur(10px);
                  }}
                  .header h1 {{
                      font-size: 3em;
                      background: linear-gradient(135deg, #667eea, #764ba2);
                      -webkit-background-clip: text;
                      -webkit-text-fill-color: transparent;
                      margin-bottom: 10px;
                  }}
                  .header .subtitle {{
                      color: #a0aec0;
                      font-size: 1.1em;
                  }}
                  .header .provider {{
                      color: #9f7aea;
                      font-size: 0.9em;
                      margin-top: 5px;
                  }}
                  .grid {{
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                      gap: 20px;
                      margin-bottom: 30px;
                  }}
                  .card {{
                      background: rgba(255,255,255,0.05);
                      backdrop-filter: blur(10px);
                      border: 1px solid rgba(255,255,255,0.1);
                      border-radius: 15px;
                      padding: 25px;
                      transition: transform 0.3s, box-shadow 0.3s;
                  }}
                  .card:hover {{
                      transform: translateY(-5px);
                      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
                  }}
                  .card h3 {{
                      color: #9f7aea;
                      font-size: 0.85em;
                      text-transform: uppercase;
                      letter-spacing: 2px;
                      margin-bottom: 15px;
                  }}
                  .stat {{
                      font-size: 2.5em;
                      font-weight: bold;
                      color: #e0e0e0;
                      margin: 10px 0;
                  }}
                  .stat-label {{
                      color: #a0aec0;
                      font-size: 0.9em;
                  }}
                  .badge {{
                      display: inline-block;
                      padding: 4px 12px;
                      border-radius: 20px;
                      font-size: 0.8em;
                      font-weight: 600;
                      margin: 3px;
                  }}
                  .badge-good {{ background: rgba(72,187,120,0.3); color: #48bb78; }}
                  .badge-warn {{ background: rgba(237,137,54,0.3); color: #ed8936; }}
                  .badge-purple {{ background: rgba(159,122,234,0.3); color: #9f7aea; }}
                  .list-item {{
                      padding: 10px 0;
                      border-bottom: 1px solid rgba(255,255,255,0.05);
                  }}
                  .list-item:last-child {{ border-bottom: none; }}
                  .progress-bar {{
                      width: 100%;
                      height: 6px;
                      background: rgba(255,255,255,0.1);
                      border-radius: 10px;
                      overflow: hidden;
                      margin-top: 8px;
                  }}
                  .progress-fill {{
                      height: 100%;
                      background: linear-gradient(90deg, #667eea, #764ba2);
                      border-radius: 10px;
                      transition: width 1s;
                  }}
                  @media (max-width: 768px) {{
                      .grid {{ grid-template-columns: 1fr; }}
                      .header h1 {{ font-size: 2em; }}
                  }}
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <h1>🧠 AI SEO Intelligence</h1>
                      <p class="subtitle">Smart SEO for VideoCameraHoliday</p>
                      <p class="provider">🤖 Powered by DeepSeek</p>
                      <p style="color: #718096; font-size: 0.9em; margin-top: 5px;">
                          Last Updated: {datetime.now().strftime('%Y-%m-%d %H:%M:%S UTC')}
                      </p>
                  </div>
                  
                  <div class="grid">
                      <div class="card">
                          <h3>📊 Pages Optimized</h3>
                          <div class="stat">{len(pages)}</div>
                          <div class="stat-label">Total pages processed</div>
                      </div>
                      
                      <div class="card">
                          <h3>🎯 Keywords Found</h3>
                          <div class="stat">{len(primary_kw) + len(long_tail)}</div>
                          <div class="stat-label">{len(primary_kw)} primary, {len(long_tail)} long-tail</div>
                      </div>
                      
                      <div class="card">
                          <h3>🔗 Internal Links</h3>
                          <div class="stat">{links.get('total_links', 0)}</div>
                          <div class="stat-label">{links.get('total_pages', 0)} pages linked</div>
                      </div>
                      
                      <div class="card">
                          <h3>📝 Blog Ideas</h3>
                          <div class="stat">10</div>
                          <div class="stat-label">Ready to write</div>
                      </div>
                  </div>
                  
                  <div class="grid">
                      <div class="card">
                          <h3>🎯 Top Keywords</h3>
                          <div style="margin-top:10px;">
                              {''.join([f'<span class="badge badge-good">{kw}</span> ' for kw in primary_kw[:8]])}
                              {''.join([f'<span class="badge badge-purple">{kw}</span> ' for kw in long_tail[:5]])}
                          </div>
                      </div>
                      
                      <div class="card">
                          <h3>⚠️ Orphan Pages</h3>
                          <div class="stat" style="font-size:1.5em;">{links.get('orphan_pages', 0)}</div>
                          <div class="stat-label">Pages with no internal links</div>
                      </div>
                  </div>
                  
                  <div class="card" style="margin-top:20px;">
                      <h3>💡 AI Recommendations</h3>
                      <div style="margin-top:15px;">
                          {''.join([f'''
                          <div class="list-item">
                              <strong>📝 {opt.get('url', 'Page')}</strong>
                              <p style="color: #a0aec0; font-size:0.9em; margin-top:5px;">
                                  {opt.get('optimized', {}).get('content_tips', ['No tips'])[:2] if opt.get('optimized', {}).get('content_tips') else 'No content tips available'}
                              </p>
                          </div>
                          ''' for opt in pages[:3]])}
                      </div>
                  </div>
                  
                  <div style="text-align:center; margin-top:30px; color:#718096; font-size:0.8em;">
                      🤖 Generated by AI SEO Intelligence System (DeepSeek) | 
                      <a href="${{ github.server_url }}/${{ github.repository }}/actions" style="color:#9f7aea;">View all runs</a>
                  </div>
              </div>
          </body>
          </html>
          '''
          
          with open('ai-dashboard.html', 'w') as f:
              f.write(html)
          
          print("✅ Dashboard generated")
          EOF

      - name: 📤 Upload Dashboard
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ai-dashboard-${{ github.run_number }}
          path: ai-dashboard.html
          retention-days: 90

  # ========================================================================
  # JOB 6: CLEANUP
  # ========================================================================
  cleanup:
    name: 🧹 Cleanup Old Reports
    needs: [dashboard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: 🧹 Clean old artifacts
        run: |
          echo "🧹 Keeping only last 10 artifacts"
          # Artifacts automatically cleaned based on retention days
          echo "✅ Cleanup complete"

      - name: ✅ Workflow complete
        run: echo "✅ AI SEO Intelligence System complete!"

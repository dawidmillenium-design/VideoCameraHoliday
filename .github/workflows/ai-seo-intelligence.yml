  # ========================================================================
  # JOB 6: NOTIFICATIONS
  # ========================================================================
  notifications:
    name: 🔔 AI Notifications
    needs: [content-optimizer, smart-linking]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: 📊 Generate notification
        run: |
          cat > notification.md << 'EOF'
          ## 🧠 AI SEO Update

          **Status:** ${{ needs.content-optimizer.result }}
          **Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')

          ### 📊 Summary

          - Pages Analyzed: $(cat ai-seo-summary.json | jq -r '.pages_analyzed' 2>/dev/null || echo "N/A")
          - Optimizations Applied: $(cat ai-seo-summary.json | jq -r '.suggestions_generated' 2>/dev/null || echo "N/A")
          - Keywords Found: $(cat ai-keyword-research.json | jq -r '.primary_keywords | length' 2>/dev/null || echo "N/A")

          ### 🔗 Links

          [View Dashboard](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

      - name: 🔔 Slack notification
        if: always() && secrets.SLACK_WEBHOOK_URL
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"${{ job.status == 'success' && '✅' || '❌' }} AI SEO Workflow ${{ job.status }}\\nRepo: ${{ github.repository }}\\nDashboard: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}" || true

      - name: 📝 Create issue summary
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "📊 AI SEO Report - $(date +'%Y-%m-%d')" \
            --body-file notification.md \
            --label "ai, seo, automated" || true

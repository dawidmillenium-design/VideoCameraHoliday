name: Generate Insta360 Invisible Stick Test Series

on:
  workflow_dispatch:
    inputs:
      camera_model:
        description: 'Insta360 Camera Model'
        required: true
        default: 'Insta360 X4'
      test_locations:
        description: 'Real-world test locations (comma-separated)'
        required: false
        default: 'Bangkok Night Market, Santorini Cliffside, Swiss Alps Ski Slope, Miami Beach'
      series_focus:
        description: 'Main angle of the series'
        required: false
        default: 'Proving the invisible stick works in extreme, crowded, and challenging real-world holiday scenarios'

jobs:
  generate-series:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
      CAMERA_MODEL: ${{ github.event.inputs.camera_model }}
      TEST_LOCATIONS: ${{ github.event.inputs.test_locations }}
      SERIES_FOCUS: ${{ github.event.inputs.series_focus }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Output Directory
        run: mkdir -p content/series

      - name: Execute 5-Agent Content Pipeline
        run: python scripts/insta360_stick_series_pipeline.py

      - name: Post to Job Summary
        if: always()
        run: |
          if [ -f summary.md ]; then
            cat summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ Pipeline Failed" >> $GITHUB_STEP_SUMMARY
            echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and Push Generated Content
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/series/
          git diff --staged --quiet || git commit -m "content: auto-generate Insta360 Invisible Stick real-world test series [skip ci]"
          git push origin HEAD:main

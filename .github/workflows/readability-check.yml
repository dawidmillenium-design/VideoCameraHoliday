name: 📝 Readability Check

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.html'
  workflow_dispatch:

jobs:
  readability:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install dependencies
        run: npm install cheerio readability

      - name: 🔍 Check readability scores
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const cheerio = require('cheerio');
          
          function getReadabilityScore(text) {
            // Simple Flesch-Kincaid readability estimation
            const words = text.split(/\\s+/).length;
            const sentences = text.split(/[.!?]+/).length;
            const syllables = text.toLowerCase().match(/[aeiouy]{1,2}/g)?.length || 1;
            
            if (words === 0 || sentences === 0) return 0;
            
            // Flesch Reading Ease approximation
            const score = 206.835 - 1.015 * (words / sentences) - 84.6 * (syllables / words);
            return Math.min(100, Math.max(0, score));
          }
          
          function getWordCount(text) {
            return text.split(/\\s+/).length;
          }
          
          function analyzePage(filePath) {
            const content = fs.readFileSync(filePath, 'utf8');
            const $ = cheerio.load(content);
            const text = $('body').text().replace(/\\s+/g, ' ').trim();
            const wordCount = getWordCount(text);
            const readability = getReadabilityScore(text);
            
            const issues = [];
            if (wordCount < 300) issues.push('Low word count: ' + wordCount + ' words');
            if (readability < 50) issues.push('Poor readability score: ' + Math.round(readability));
            if (!$('h2').length) issues.push('No H2 headings found');
            if ($('p').length < 3) issues.push('Very few paragraphs');
            
            return { filePath, wordCount, readability, issues };
          }
          
          const results = [];
          function walkDir(dir) {
            const files = fs.readdirSync(dir);
            for (const file of files) {
              const fullPath = path.join(dir, file);
              const stat = fs.statSync(fullPath);
              if (stat.isDirectory() && !file.startsWith('.') && file !== 'node_modules' && file !== 'assets') {
                walkDir(fullPath);
              } else if (file.endsWith('.html') || file.endsWith('.htm')) {
                results.push(analyzePage(fullPath));
              }
            }
          }
          
          walkDir('.');
          
          let hasIssues = false;
          console.log('📊 READABILITY REPORT');
          console.log('=' .repeat(50));
          
          for (const result of results) {
            if (result.issues.length > 0) {
              console.log('❌ ' + result.filePath + ':');
              result.issues.forEach(i => console.log('  - ' + i));
              hasIssues = true;
            } else {
              console.log('✅ ' + result.filePath + ' - ' + result.wordCount + ' words, score: ' + Math.round(result.readability));
            }
          }
          
          if (hasIssues) {
            console.log('\\n⚠️ Some pages need content improvements.');
            process.exit(1);
          } else {
            console.log('\\n✅ All pages have good content quality.');
          }
          "

      - name: 📤 Upload report
        uses: actions/upload-artifact@v4
        with:
          name: readability-report
          path: readability-report.txt

name: Site link check

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * 1' # weekly at 06:00 UTC (edit as desired)

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Validate technical SEO
        run: python tools/validate_seo.py

      - name: Install deps
        run: python -m pip install --upgrade pip && pip install requests beautifulsoup4 lxml

      - name: Run site crawler
        run: |
          python site_crawler.py
        env:
          # if you want to override default seed, you can set env vars in the script to read from
          # (not required if site_crawler.py has correct seed)
          SITE_DOMAIN: dawidmillenium-design.github.io
          SITE_PATH_PREFIX: /VideoCameraHoliday
         

      - name: Upload reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: link-check-reports
          path: |
            report.csv
            report.json

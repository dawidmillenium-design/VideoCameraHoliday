--- .github/workflows/weekly-seo-audit.yml (原始)
name: Weekly SEO Audit

on:
  schedule:
    # Runs every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allows manual trigger

jobs:
  weekly-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install cheerio axios

      - name: Run SEO audit
        run: node audit-canonical.js

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: weekly-seo-audit-report
          path: |
            audit-report.json
            audit-summary.txt

      - name: Send summary to console
        run: cat audit-summary.txt


+++ .github/workflows/weekly-seo-audit.yml (修改后)
name: Weekly SEO Audit

on:
  schedule:
    # Runs every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allows manual trigger

# Prevent concurrent runs of this workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  weekly-audit:
    name: 📊 Weekly SEO Audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          npm install cheerio axios
          echo "✅ Dependencies installed"

      - name: 🔍 Check for audit script
        id: check-script
        run: |
          echo "Checking for SEO audit scripts..."
          if [ -f "audit-canonical.js" ]; then
            echo "script_found=true" >> $GITHUB_OUTPUT
            echo "✅ Found: audit-canonical.js"
          else
            echo "script_found=false" >> $GITHUB_OUTPUT
            echo "⚠️ audit-canonical.js not found (will use inline audit)"
          fi

      - name: 🔧 Run SEO audit (external script)
        if: steps.check-script.outputs.script_found == 'true'
        run: |
          echo "Running external SEO audit script..."
          node audit-canonical.js
          echo "✅ External audit completed"
        continue-on-error: true

      - name: 🔧 Run inline SEO audit
        if: steps.check-script.outputs.script_found == 'false'
        run: |
          echo "Running inline SEO audit..."
          node -e "
          const fs = require('fs');
          const path = require('path');
          const cheerio = require('cheerio');

          const results = {
            timestamp: new Date().toISOString(),
            pages: [],
            summary: { total: 0, critical: 0, warnings: 0 }
          };

          function auditPage(filePath) {
            try {
              const content = fs.readFileSync(filePath, 'utf8');
              const \$ = cheerio.load(content);
              const issues = [];

              // Check title
              const title = \$('title').text().trim();
              if (!title) issues.push({ severity: 'critical', issue: 'Missing title tag' });
              else if (title.length > 60) issues.push({ severity: 'warning', issue: 'Title too long (' + title.length + ' chars)' });

              // Check meta description
              const desc = \$('meta[name=\"description\"]').attr('content');
              if (!desc) issues.push({ severity: 'critical', issue: 'Missing meta description' });
              else if (desc.length < 150 || desc.length > 160) issues.push({ severity: 'warning', issue: 'Meta description length suboptimal (' + desc.length + ' chars)' });

              // Check canonical
              const canonical = \$('link[rel=\"canonical\"]').attr('href');
              if (!canonical) issues.push({ severity: 'critical', issue: 'Missing canonical tag' });

              // Check H1
              const h1s = \$('h1').length;
              if (h1s === 0) issues.push({ severity: 'critical', issue: 'No H1 heading found' });
              else if (h1s > 1) issues.push({ severity: 'warning', issue: 'Multiple H1 headings (' + h1s + ')' });

              // Check Open Graph
              const ogTitle = \$('meta[property=\"og:title\"]').attr('content');
              if (!ogTitle) issues.push({ severity: 'warning', issue: 'Missing og:title' });

              return { filePath, title, issues };
            } catch (e) {
              return { filePath, error: e.message };
            }
          }

          function walkDir(dir) {
            const files = fs.readdirSync(dir);
            for (const file of files) {
              const fullPath = path.join(dir, file);
              const stat = fs.statSync(fullPath);
              if (stat.isDirectory() && !file.startsWith('.') && file !== 'node_modules' && file !== 'assets') {
                walkDir(fullPath);
              } else if (file.endsWith('.html')) {
                results.pages.push(auditPage(fullPath));
              }
            }
          }

          walkDir('.');

          // Calculate summary
          results.summary.total = results.pages.length;
          results.pages.forEach(p => {
            p.issues?.forEach(i => {
              if (i.severity === 'critical') results.summary.critical++;
              else if (i.severity === 'warning') results.summary.warnings++;
            });
          });

          // Write JSON report
          fs.writeFileSync('audit-report.json', JSON.stringify(results, null, 2));

          // Write text summary
          let summary = '📊 WEEKLY SEO AUDIT SUMMARY\\n';
          summary += '============================\\n';
          summary += 'Date: ' + new Date().toISOString() + '\\n';
          summary += 'Total pages audited: ' + results.summary.total + '\\n';
          summary += 'Critical issues: ' + results.summary.critical + '\\n';
          summary += 'Warnings: ' + results.summary.warnings + '\\n\\n';

          if (results.summary.critical > 0) {
            summary += '❌ CRITICAL ISSUES:\\n';
            results.pages.filter(p => p.issues?.some(i => i.severity === 'critical')).forEach(p => {
              p.issues.filter(i => i.severity === 'critical').forEach(i => {
                summary += '  - ' + p.filePath + ': ' + i.issue + '\\n';
              });
            });
          }

          if (results.summary.warnings > 0) {
            summary += '\\n⚠️ WARNINGS:\\n';
            results.pages.filter(p => p.issues?.some(i => i.severity === 'warning')).slice(0, 10).forEach(p => {
              p.issues.filter(i => i.severity === 'warning').forEach(i => {
                summary += '  - ' + p.filePath + ': ' + i.issue + '\\n';
              });
            });
          }

          summary += '\\n✅ Audit complete!';
          fs.writeFileSync('audit-summary.txt', summary);
          console.log(summary);

          // Exit with error if critical issues found
          if (results.summary.critical > 0) {
            process.exit(1);
          }
          "
        continue-on-error: true

      - name: 📊 Generate audit summary
        run: |
          echo "📊 WEEKLY SEO AUDIT REPORT" > weekly-audit-summary.txt
          echo "==========================" >> weekly-audit-summary.txt
          echo "Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> weekly-audit-summary.txt
          echo "Branch: ${{ github.ref_name }}" >> weekly-audit-summary.txt
          echo "Commit: ${{ github.sha }}" >> weekly-audit-summary.txt
          echo "" >> weekly-audit-summary.txt
          echo "Audit Results:" >> weekly-audit-summary.txt
          if [ -f "audit-summary.txt" ]; then
            cat audit-summary.txt >> weekly-audit-summary.txt
          else
            echo "  ⚠️ No audit summary generated" >> weekly-audit-summary.txt
          fi
          cat weekly-audit-summary.txt

      - name: 📤 Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-seo-audit-${{ github.run_number }}
          path: |
            audit-report.json
            audit-summary.txt
            weekly-audit-summary.txt
          retention-days: 90
          if-no-files-found: warn

      - name: 🔔 Notify on failure
        if: failure()
        run: |
          echo "::error::Weekly SEO Audit workflow failed!"
          echo "Workflow: ${{ github.workflow }}"
          echo "Repository: ${{ github.repository }}"
          echo "Run ID: ${{ github.run_id }}"
          echo ""
          echo "Please check the workflow logs for details."

          # Slack notification (if webhook is configured)
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"❌ Weekly SEO Audit FAILED in ${{ github.repository }}\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "${{ secrets.SLACK_WEBHOOK_URL }}" || echo "Slack notification failed"
          fi

          # Email notification via GitHub's built-in notifications
          # Configure email notifications in repository Settings > Notifications

name: 📋 Meta & Schema Validation

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 10 * * 3'  # Every Wednesday at 10:00 AM UTC
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install dependencies
        run: |
          npm install cheerio axios

      - name: 🔍 Validate meta tags and schema
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const cheerio = require('cheerio');
          
          function validateHTML(filePath) {
            const content = fs.readFileSync(filePath, 'utf8');
            const $ = cheerio.load(content);
            const errors = [];
            
            // Check for title
            if (!$('title').text().trim()) {
              errors.push('Missing title tag');
            }
            
            // Check for meta description
            if (!$('meta[name=\"description\"]').attr('content')) {
              errors.push('Missing meta description');
            }
            
            // Check for canonical
            if (!$('link[rel=\"canonical\"]').attr('href')) {
              errors.push('Missing canonical tag');
            }
            
            // Check for Open Graph
            if (!$('meta[property=\"og:title\"]').attr('content')) {
              errors.push('Missing og:title');
            }
            
            // Check for Twitter Card
            if (!$('meta[name=\"twitter:card\"]').attr('content')) {
              errors.push('Missing twitter:card');
            }
            
            // Check for JSON-LD schema
            if (!$('script[type=\"application/ld+json\"]').length) {
              errors.push('Missing JSON-LD schema');
            }
            
            return errors;
          }
          
          const htmlFiles = [];
          function walkDir(dir) {
            const files = fs.readdirSync(dir);
            for (const file of files) {
              const fullPath = path.join(dir, file);
              const stat = fs.statSync(fullPath);
              if (stat.isDirectory() && !file.startsWith('.') && file !== 'node_modules' && file !== 'assets') {
                walkDir(fullPath);
              } else if (file.endsWith('.html') || file.endsWith('.htm')) {
                htmlFiles.push(fullPath);
              }
            }
          }
          
          walkDir('.');
          
          let hasErrors = false;
          for (const file of htmlFiles) {
            const errors = validateHTML(file);
            if (errors.length > 0) {
              console.log('❌ ' + file + ':');
              errors.forEach(e => console.log('  - ' + e));
              hasErrors = true;
            }
          }
          
          if (!hasErrors) {
            console.log('✅ All pages have valid meta tags and schema.');
          } else {
            process.exit(1);
          }
          "

      - name: 📤 Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: meta-schema-report
          path: meta-schema-report.txt

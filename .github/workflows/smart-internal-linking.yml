name: 🔗 Smart Internal Linking & Orphan Fixer

on:
  workflow_dispatch:
    inputs:
      max_links_per_page:
        description: 'Maximum links to add to a single page (safety limit)'
        required: false
        default: '3'
      dry_run:
        description: 'Test mode - show what would be linked without making changes'
        required: false
        default: 'true'
        type: boolean
  schedule:
    # Run every Sunday at 2 AM UTC to keep site interconnected
    - cron: '0 2 * * 0'

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-internal-links:
    name: Build Internal Links
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name:  Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai beautifulsoup4 lxml

      - name: 🔗 Run Orphan Link Builder
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MAX_LINKS: ${{ github.event.inputs.max_links_per_page || '3' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
        run: python scripts/orphan_link_builder.py

      - name: 📊 Show Linking Summary
        run: |
          if [ -f "linking-summary.json" ]; then
            echo "## 🔗 Internal Linking Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat linking-summary.json | python -c "
          import json, sys
          data = json.load(sys.stdin)
          print(f\"**Orphan Pages Found:** {data['orphans_found']}\")
          print(f\"**Links Added:** {data['links_added']}\")
          print(f\"**Pages Modified:** {len(data['modified_files'])}\")
          " >> $GITHUB_STEP_SUMMARY
          fi

      - name: ⚙️ Configure Git
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: 💾 Commit Link Improvements
        if: github.event.inputs.dry_run != 'true'
        run: |
          git add *.html
          git add **/*.html
          if ! git diff --staged --quiet; then
            git commit -m "feat: auto-fix internal linking and orphan pages [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "✅ Link improvements committed"
          else
            echo "⚠️ No changes to commit"
          fi

      - name: 📤 Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "linking-report-${{ github.run_number }}"
          path: |
            linking-summary.json
            orphan-list.json
          retention-days: 14

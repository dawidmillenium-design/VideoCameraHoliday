name: Inject Breadcrumbs + Hero into Articles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/inject_hero_breadcrumbs.py'
      - '.github/workflows/inject-hero-breadcrumbs.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dry run first
        run: python scripts/inject_hero_breadcrumbs.py --dry-run

      - name: Apply injection
        run: python scripts/inject_hero_breadcrumbs.py

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: inject breadcrumbs + article hero into article pages [skip ci]"
          git push

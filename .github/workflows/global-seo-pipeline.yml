name: Global SEO Content Pipeline

on:
  workflow_dispatch:
    inputs:
      brief_id:
        description: 'Content Brief ID (e.g., comp-2026-001)'
        required: true
        default: 'comp-2026-001'
      languages:
        description: 'Languages to generate (comma-separated, or "all" for 14 languages)'
        required: false
        default: 'all'
      validate_schema:
        description: 'Validate output against schema'
        required: false
        default: 'true'
      create_pull_request:
        description: 'Create PR instead of direct commit'
        required: false
        default: 'true'
  schedule:
    # Run every Monday at 6 AM UTC for weekly content generation
    - cron: '0 6 * * 1'
  push:
    paths:
      - 'data/content_briefs/*.json'

env:
  PYTHON_VERSION: '3.11'
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  generate-content:
    name: Generate Multi-Language Content
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jsonschema python-dotenv requests beautifulsoup4 lxml

      - name: Determine brief ID
        id: brief
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "brief_id=${{ github.event.inputs.brief_id }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "push" ]; then
            # Extract brief ID from pushed file
            BRIEF_FILE=$(git diff --name-only HEAD~1 HEAD | grep 'data/content_briefs/' | head -1)
            BRIEF_ID=$(basename "$BRIEF_FILE" .json)
            echo "brief_id=$BRIEF_ID" >> $GITHUB_OUTPUT
          else
            echo "brief_id=comp-2026-001" >> $GITHUB_OUTPUT
          fi

      - name: Determine languages
        id: languages
        run: |
          if [ "${{ github.event.inputs.languages }}" == "all" ] || [ -z "${{ github.event.inputs.languages }}" ]; then
            echo "languages=en-US es-ES fr-FR de-DE ja-JP ko-KR zh-CN ar-SA hi-IN it-IT tr-TR ru-RU pl-PL th-TH" >> $GITHUB_OUTPUT
          else
            echo "languages=${{ github.event.inputs.languages }}" >> $GITHUB_OUTPUT
          fi

      - name: Validate brief exists
        run: |
          if [ ! -f "data/content_briefs/${{ steps.brief.outputs.brief_id }}.json" ]; then
            echo "❌ Error: Brief file not found: data/content_briefs/${{ steps.brief.outputs.brief_id }}.json"
            exit 1
          fi
          echo "✅ Found brief: ${{ steps.brief.outputs.brief_id }}"

      - name: Validate brief against schema
        if: github.event.inputs.validate_schema == 'true'
        run: |
          python -c "
          import json
          import jsonschema
          import sys
          
          try:
              with open('output_schema.json') as f:
                  schema = json.load(f)
              with open('data/content_briefs/${{ steps.brief.outputs.brief_id }}.json') as f:
                  brief = json.load(f)
              jsonschema.validate(instance=brief, schema=schema)
              print('✅ Brief validation passed')
          except jsonschema.ValidationError as e:
              print(f'❌ Validation failed: {e.message}')
              sys.exit(1)
          "

      - name: Run Global SEO Pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python global_seo_pipeline.py \
            --brief "data/content_briefs/${{ steps.brief.outputs.brief_id }}.json" \
            --languages ${{ steps.languages.outputs.languages }} \
            --output-dir "content/generated" \
            --validate-schema \
            --generate-internal-links \
            --log-level INFO \
            --cache-dir ".cache/pipeline"

      - name: Count generated files
        id: count
        run: |
          TOTAL_FILES=$(find content/generated -name "*.html" 2>/dev/null | wc -l)
          echo "total_files=$TOTAL_FILES" >> $GITHUB_OUTPUT
          echo "✅ Generated $TOTAL_FILES HTML files"
          
          # List generated languages
          echo "Generated languages:"
          ls -1 content/generated/ 2>/dev/null || echo "No files generated"

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Create Pull Request
        if: github.event.inputs.create_pull_request == 'true' || github.event_name == 'schedule'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: generate content for ${{ steps.brief.outputs.brief_id }} (${{ steps.count.outputs.total_files }} files)"
          branch: "content/${{ steps.brief.outputs.brief_id }}"
          delete-branch: true
          title: "📝 Add multi-language content: ${{ steps.brief.outputs.brief_id }}"
          body: |
            ## Auto-Generated Content
            
            **Brief ID:** ${{ steps.brief.outputs.brief_id }}
            **Languages:** ${{ steps.languages.outputs.languages }}
            **Files Generated:** ${{ steps.count.outputs.total_files }}
            
            ### Generated Content:
            $(find content/generated -name "*.html" -type f | head -20 | sed 's/^/- /')
            
            ### Validation:
            - ✅ Schema validation passed
            - ✅ Internal links generated
            - ✅ SEO metadata added
            
            **Automated by:** Global SEO Content Pipeline
            
            ---
            *This PR was automatically generated. Please review before merging.*
          labels: |
            automated-pr
            content-generation
            seo
          assignees: dawidmillenium-design

      - name: Direct Commit (if not creating PR)
        if: github.event.inputs.create_pull_request != 'true' && github.event_name != 'schedule'
        run: |
          git add content/generated/
          git commit -m "feat: generate content for ${{ steps.brief.outputs.brief_id }} (${{ steps.count.outputs.total_files }} files) [skip ci]"
          git push origin main

      - name: Upload generated content as artifact
        uses: actions/upload-artifact@v4
        with:
          name: "generated-content-${{ steps.brief.outputs.brief_id }}"
          path: content/generated/
          retention-days: 30
          if-no-files-found: error

      - name: Generate pipeline report
        run: |
          cat > pipeline-report-${{ steps.brief.outputs.brief_id }}.md << EOF
          # Pipeline Execution Report
          
          **Brief ID:** ${{ steps.brief.outputs.brief_id }}
          **Execution Time:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Trigger:** ${{ github.event_name }}
          
          ## Summary
          - **Languages Processed:** $(echo "${{ steps.languages.outputs.languages }}" | wc -w)
          - **Files Generated:** ${{ steps.count.outputs.total_files }}
          - **Status:** ✅ Success
          
          ## Generated Files by Language
          $(for lang_dir in content/generated/*/; do
            if [ -d "$lang_dir" ]; then
              lang=$(basename "$lang_dir")
              count=$(find "$lang_dir" -name "*.html" | wc -l)
              echo "- **$lang**: $count files"
            fi
          done)
          
          ## Validation Results
          - Schema Validation: ✅ Passed
          - Internal Links: ✅ Generated
          - SEO Metadata: ✅ Added
          EOF
          
          cat pipeline-report-${{ steps.brief.outputs.brief_id }}.md

      - name: Upload pipeline report
        uses: actions/upload-artifact@v4
        with:
          name: "pipeline-report-${{ steps.brief.outputs.brief_id }}"
          path: pipeline-report-${{ steps.brief.outputs.brief_id }}.md
          retention-days: 90

  post-processing:
    name: Post-Processing & Notifications
    runs-on: ubuntu-latest
    needs: generate-content
    if: always()
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "generated-content-*"
          merge-multiple: true
          path: content/generated/

      - name: Update sitemap
        run: |
          if command -v python &> /dev/null; then
            python generate-sitemap.py --input-dir content/generated/ --output-dir . || echo "Sitemap generation skipped"
          fi

      - name: Notify on success
        if: needs.generate-content.result == 'success'
        run: |
          echo "✅ Global SEO Pipeline completed successfully!"
          echo "Generated content is ready for review."
          # Add Slack/Discord notification here if configured

      - name: Notify on failure
        if: needs.generate-content.result == 'failure'
        run: |
          echo "❌ Global SEO Pipeline failed!"
          echo "Please check the workflow logs for details."
          exit 1

#!/usr/bin/env python3
"""
Global SEO Content Pipeline
Generates multi-language, SEO-optimized HTML content using DeepSeek API.
"""

import os
import json
import argparse
import logging
from datetime import datetime
from pathlib import Path
from openai import OpenAI
from dotenv import load_dotenv

# Load environment variables from .env file
load_dotenv()

# Configure Logging
logging.basicConfig(
    level=logging.INFO,
    format='%(asctime)s - %(levelname)s - %(message)s',
    handlers=[
        logging.FileHandler("pipeline.log"),
        logging.StreamHandler()
    ]
)

# Initialize DeepSeek Client (Compatible with OpenAI Python library)
DEEPSEEK_API_KEY = os.getenv("DEEPSEEK_API_KEY")
if not DEEPSEEK_API_KEY:
    logging.warning("DEEPSEEK_API_KEY not found in environment variables. Pipeline will fail on generation.")

client = OpenAI(
    api_key=DEEPSEEK_API_KEY,
    base_url="https://api.deepseek.com"
)

def load_brief(brief_path: str) -> dict:
    """Load and return the JSON content brief."""
    logging.info(f"Loading brief from: {brief_path}")
    with open(brief_path, 'r', encoding='utf-8') as f:
        return json.load(f)

def build_prompt(brief: dict, target_lang: str) -> str:
    """Construct the prompt for DeepSeek based on the brief and target language."""
    lang_name = target_lang.split('-')[0] # e.g., 'es-ES' -> 'es'
    
    prompt = f"""You are an expert SEO content writer and travel photography specialist. 
Your task is to write a comprehensive, highly engaging, and SEO-optimized blog post in {target_lang}.

# CONTEXT & BRIEF:
- Title: {brief['meta']['title_en']}
- Primary Keyword: {brief['seo']['primary_keyword']}
- Target Audience: Travel photographers and vloggers
- Word Count Target: ~{brief['meta']['word_count_target']} words

# CONTENT OUTLINE:
{json.dumps(brief['content_brief']['outline'], indent=2)}

# EEAT REQUIREMENTS (Crucial):
- Experience: Mention real-world testing locations (Bangkok, Lisbon, Alps, Finland). Use first-person plural ("we tested", "our findings").
- Expertise: Use correct technical terminology (e.g., 3-axis gimbal, HyperSmooth, 1-inch sensor, f/1.8 aperture).
- Trustworthiness: Maintain an objective, helpful tone. 

# FORMATTING RULES:
1. Output ONLY valid HTML5 (no markdown code blocks like ```html).
2. Use <h1> for the main title (translate the H1 to {target_lang}).
3. Use <h2> and <h3> for the outline sections.
4. Include a comparison table using <table>, <thead>, <tbody>, <tr>, <th>, <td>.
5. Include the internal links provided in the brief, translating the anchor text to {target_lang} but keeping the target_url exactly as provided.
6. Ensure the primary keyword appears naturally 2-3 times.

# INTERNAL LINKS TO INCLUDE:
{json.dumps(brief['internal_linking_map']['outbound_links'], indent=2)}

Begin writing the HTML content now:
"""
    return prompt

def generate_content(prompt: str) -> str:
    """Call DeepSeek API to generate content."""
    logging.info("Requesting content generation from DeepSeek...")
    try:
        response = client.chat.completions.create(
            model="deepseek-chat",
            messages=[
                {"role": "system", "content": "You are an expert SEO travel blogger. Output ONLY raw HTML5, no markdown formatting, no explanations."},
                {"role": "user", "content": prompt}
            ],
            temperature=0.7,
            max_tokens=4000
        )
        content = response.choices[0].message.content
        # Clean up markdown code blocks if the model adds them anyway
        if content.startswith("```html"):
            content = content[7:]
        if content.endswith("```"):
            content = content[:-3]
        return content.strip()
    except Exception as e:
        logging.error(f"DeepSeek API Error: {e}")
        raise

def generate_schema_html(brief: dict, lang: str) -> str:
    """Generate localized JSON-LD Schema markup."""
    schema = brief.get('schema_markup', {})
    if not schema:
        return ""
    
    # Basic localization of schema (in a full pipeline, you'd translate the schema text too)
    schema_str = json.dumps(schema, indent=2)
    return f"<script type=\"application/ld+json\">\n{schema_str}\n</script>"

def save_output(lang: str, slug: str, html_content: str, schema_html: str, output_dir: str):
    """Save the generated HTML to the correct language directory."""
    lang_dir = Path(output_dir) / lang
    lang_dir.mkdir(parents=True, exist_ok=True)
    
    file_path = lang_dir / f"{slug}.html"
    
    # Wrap in basic HTML boilerplate if not already present
    if not html_content.strip().startswith("<!DOCTYPE html>"):
        final_html = f"""<!DOCTYPE html>
<html lang="{lang}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{slug.replace('-', ' ').title()}</title>
    {schema_html}
</head>
<body>
    {html_content}
</body>
</html>"""
    else:
        # Inject schema into head if it's a full HTML doc
        final_html = html_content.replace("</head>", f"    {schema_html}\n</head>")

    with open(file_path, 'w', encoding='utf-8') as f:
        f.write(final_html)
    
    logging.info(f"✅ Successfully saved: {file_path}")

def main():
    parser = argparse.ArgumentParser(description="Global SEO Content Pipeline")
    parser.add_argument("--brief", required=True, help="Path to the JSON content brief")
    parser.add_argument("--languages", nargs='+', help="List of languages to generate (e.g., en-US es-ES)")
    parser.add_argument("--output-dir", default="content/generated", help="Output directory for generated HTML")
    args = parser.parse_args()

    logging.info("🚀 Starting Global SEO Content Pipeline")
    
    # 1. Load Brief
    brief = load_brief(args.brief)
    slug = brief['meta']['slug']
    
    # Determine languages: use args if provided, else fallback to brief's target_languages
    languages = args.languages if args.languages else brief['meta']['target_languages']
    logging.info(f"Target languages: {', '.join(languages)}")

    # 2. Iterate and Generate
    success_count = 0
    for lang in languages:
        logging.info(f"--- Processing Language: {lang} ---")
        try:
            prompt = build_prompt(brief, lang)
            html_content = generate_content(prompt)
            schema_html = generate_schema_html(brief, lang)
            save_output(lang, slug, html_content, schema_html, args.output_dir)
            success_count += 1
        except Exception as e:
            logging.error(f"❌ Failed to generate content for {lang}: {e}")
            continue

    # 3. Summary
    logging.info("="*50)
    logging.info(f"🎉 Pipeline Complete! Successfully generated {success_count}/{len(languages)} languages.")
    logging.info(f"Output directory: {os.path.abspath(args.output_dir)}")
    logging.info("="*50)

if __name__ == "__main__":
    main()

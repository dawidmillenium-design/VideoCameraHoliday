name: LensRanker AI - SEO Content Generator

on:
  workflow_dispatch:
    inputs:
      camera_gear:
        description: 'Target Camera Gear (e.g., Sony A7IV, DJI Osmo)'
        required: true
        default: 'DJI Osmo Pocket 3'
      destination:
        description: 'Holiday Destination (e.g., Kyoto, Iceland)'
        required: true
        default: 'Iceland Ring Road'

jobs:
  generate-seo-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai python-slugify[unidecode] pyyaml

      - name: Generate Content via DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TARGET_CAMERA: ${{ github.event.inputs.camera_gear }}
          TARGET_DESTINATION: ${{ github.event.inputs.destination }}
        run: python scripts/generate_deepseek_post.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(content): Add SEO optimized post for ${{ github.event.inputs.destination }}"
          title: "🤖 LensRanker: ${{ github.event.inputs.camera_gear }} in ${{ github.event.inputs.destination }}"
          body: |
            ### 🤖 Generated by LensRanker AI (DeepSeek API)
            
            **Target Gear:** ${{ github.event.inputs.camera_gear }}
            **Location:** ${{ github.event.inputs.destination }}
            
            #### ✅ Checklist for Review:
            - [ ] Verify camera specs (ISO limits, lens mount)
            - [ ] Check location accuracy (seasons, permits)
            - [ ] Add real photos from the trip
            
            *Generated automatically. Please review before merging.*
          branch: lensranker-auto/${{ github.event.inputs.destination }}
          delete-branch: true
          labels: automated-content, seo

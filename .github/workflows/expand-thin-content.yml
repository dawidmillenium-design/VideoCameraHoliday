name: Expand Thin Content (DeepSeek)

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Pages to process in this run"
        required: true
        default: "5"
      word_threshold:
        description: "Only process pages below this word count"
        required: true
        default: "500"
      target_words:
        description: "Target word count for expanded pages"
        required: true
        default: "800"
      dry_run:
        description: "Dry run (no API calls, no writes)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify CSV exists
        run: |
          if [ ! -f scripts/thin_content_report.csv ]; then
            echo "::error::scripts/thin_content_report.csv missing."
            echo "Run the audit workflow first (scripts/audit_thin_content.py)."
            exit 1
          fi

      - name: Expand thin content
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
        run: |
          python scripts/expand_thin_content.py \
            --csv scripts/thin_content_report.csv \
            --batch-size "${{ inputs.batch_size }}" \
            --threshold "${{ inputs.word_threshold }}" \
            --target-words "${{ inputs.target_words }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat | tail -50
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true' && !inputs.dry_run
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "content: expand ${{ inputs.batch_size }} thin pages via DeepSeek"
          branch: content/expand-thin-${{ github.run_number }}
          base: main
          delete-branch: true
          title: "Content expansion batch #${{ github.run_number }} — REVIEW BEFORE MERGING"
          body: |
            ## ⚠️ Human review required

            This PR was auto-generated by `expand-thin-content.yml`.
            **Do not merge blindly.** Before merging:

            - [ ] Check for invented camera specs, prices, or dates
            - [ ] Verify internal links in the diff still point to real pages
            - [ ] Read at least 3 expanded pages end-to-end
            - [ ] Confirm no `<script>` / `<iframe>` tags snuck in
            - [ ] Spot-check that images/CTAs from the original page are still present
            - [ ] Run your thin-content auditor against this branch to confirm ≥ 500 words

            **Batch parameters**
            - Pages processed: `${{ inputs.batch_size }}`
            - Threshold: `< ${{ inputs.word_threshold }}` words
            - Target: `${{ inputs.target_words }}` words
            - Model: `deepseek-chat`

name: Auto-Fix Broken Links & Generate Stubs

on:
  workflow_dispatch: # Allows manual triggering from GitHub Actions tab
  schedule:
    - cron: '0 2 * * 1' # Runs automatically at 2 AM every Monday (optional)

jobs:
  fix-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Link Remediation Script
        run: python scripts/fix_links.py

      - name: Check for Changes
        id: git-check
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff-index --quiet HEAD; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes to commit."
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.git-check.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: fix 93k+ broken links and generate missing stubs"
          branch: "chore/fix-broken-links-${{ github.run_id }}"
          title: "🔧 Auto-Fix: Resolve 93k+ Broken Links & Add Missing Stubs"
          body: |
            This PR was automatically generated to fix critical SEO issues:
            - Removed `/VideoCameraHoliday/` prefix from all internal links (93k+ instances)
            - Normalized remaining `../` relative paths to root-relative `/` paths
            - Generated SEO-friendly stub pages for missing review/guide content
            
            Please review and merge to resolve the broken link audit.
          labels: "automated-pr, seo-fix"

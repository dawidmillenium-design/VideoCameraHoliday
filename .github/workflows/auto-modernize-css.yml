name: Auto-Modernize HTML/CSS

on:
  workflow_dispatch:
    inputs:
      scan_depth:
        description: 'Number of files to analyze (0 = all)'
        required: false
        default: '10'
      auto_commit:
        description: 'Automatically commit changes'
        required: false
        default: 'false'

jobs:
  modernize:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml tenacity openai

      - name: Run AI Modernization Agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
        run: python scripts/css_html_modernizer.py

      - name: Create Pull Request
        if: github.event.inputs.auto_commit == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "chore: auto-modernize HTML/CSS with AI recommendations"
          branch: "ai-modernization-${{ github.run_id }}"
          title: " AI-Powered HTML/CSS Modernization"
          body: |
            ## Automated Modernization Report
            
            This PR was generated by the AI Modernization Agent.
            
            ### Changes Applied:
            - ✅ Updated HTML structure with modern semantic tags
            - ✅ Added modern CSS framework (Glassmorphism, Grid, Flexbox)
            - ✅ Improved responsive design
            - ✅ Enhanced accessibility
            - ✅ Optimized performance
            
            ### Files Modified:
            See the files tab for detailed changes.
            
            ### Testing Checklist:
            - [ ] Test on Chrome/Edge
            - [ ] Test on Firefox
            - [ ] Test on Safari
            - [ ] Test mobile responsiveness
            - [ ] Check accessibility (Lighthouse)
            
            Generated by AI Modernization Agent 🤖
          labels: "enhancement, css, ai-generated"

name: 📊 SEO Score Dashboard

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9:00 AM UTC
  workflow_dispatch:

jobs:
  score:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install dependencies
        run: npm install cheerio

      - name: 📊 Generate SEO scores
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const cheerio = require('cheerio');
          
          function scorePage(filePath) {
            const content = fs.readFileSync(filePath, 'utf8');
            const $ = cheerio.load(content);
            
            let score = 100;
            const issues = [];
            
            // Title (15 points)
            const title = $('title').text().trim();
            if (!title) { score -= 15; issues.push('Missing title'); }
            else if (title.length > 60) { score -= 5; issues.push('Title too long: ' + title.length + ' chars'); }
            else if (title.length < 30) { score -= 3; issues.push('Title too short: ' + title.length + ' chars'); }
            
            // Meta Description (10 points)
            const desc = $('meta[name=\"description\"]').attr('content');
            if (!desc) { score -= 10; issues.push('Missing meta description'); }
            else if (desc.length > 160) { score -= 3; issues.push('Meta desc too long: ' + desc.length + ' chars'); }
            else if (desc.length < 80) { score -= 2; issues.push('Meta desc too short: ' + desc.length + ' chars'); }
            
            // H1 (10 points)
            const h1 = $('h1').text().trim();
            if (!h1) { score -= 10; issues.push('Missing H1'); }
            
            // Canonical (10 points)
            const canonical = $('link[rel=\"canonical\"]').attr('href');
            if (!canonical) { score -= 10; issues.push('Missing canonical'); }
            
            // JSON-LD (10 points)
            if (!$('script[type=\"application/ld+json\"]').length) { score -= 10; issues.push('Missing JSON-LD schema'); }
            
            // Heading structure (10 points)
            if ($('h1').length > 1) { score -= 5; issues.push('Multiple H1s'); }
            if ($('h2').length === 0 && $('h3').length === 0) { score -= 5; issues.push('No subheadings'); }
            
            // Internal links (5 points)
            const internalLinks = $('a[href^=\"/\"]').length;
            if (internalLinks < 2) { score -= 5; issues.push('Too few internal links: ' + internalLinks); }
            
            // Word count (10 points)
            const text = $('body').text().replace(/\\s+/g, ' ').trim();
            const words = text.split(/\\s+/).length;
            if (words < 300) { score -= 10; issues.push('Low word count: ' + words); }
            else if (words < 500) { score -= 5; issues.push('Medium word count: ' + words); }
            
            // Image alt tags (5 points)
            const images = $('img');
            let missingAlt = 0;
            images.each((i, el) => {
              if (!$(el).attr('alt')) missingAlt++;
            });
            if (missingAlt > 0) { score -= Math.min(5, missingAlt); issues.push('Missing alt tags on ' + missingAlt + ' images'); }
            
            // Author box (5 points)
            if (!$('.author-box').length) { score -= 5; issues.push('Missing author box'); }
            
            // Breadcrumb (5 points)
            if (!$('.breadcrumb').length) { score -= 5; issues.push('Missing breadcrumb'); }
            
            return { filePath, score, issues, wordCount, title };
          }
          
          const results = [];
          function walkDir(dir) {
            const files = fs.readdirSync(dir);
            for (const file of files) {
              const fullPath = path.join(dir, file);
              const stat = fs.statSync(fullPath);
              if (stat.isDirectory() && !file.startsWith('.') && file !== 'node_modules' && file !== 'assets') {
                walkDir(fullPath);
              } else if (file.endsWith('.html') || file.endsWith('.htm')) {
                results.push(scorePage(fullPath));
              }
            }
          }
          
          walkDir('.');
          
          // Sort by score (lowest first)
          results.sort((a, b) => a.score - b.score);
          
          console.log('📊 SEO SCORE DASHBOARD');
          console.log('=' .repeat(60));
          console.log('Total pages: ' + results.length);
          console.log('Average score: ' + Math.round(results.reduce((s, r) => s + r.score, 0) / results.length));
          console.log('');
          
          // Show pages with score < 70
          const lowScoring = results.filter(r => r.score < 70);
          if (lowScoring.length > 0) {
            console.log('🔴 Pages with low SEO scores (<70):');
            lowScoring.forEach(r => {
              console.log('  ' + r.filePath + ' (' + r.score + '/100)');
              r.issues.forEach(i => console.log('    - ' + i));
            });
          } else {
            console.log('✅ All pages have good SEO scores!');
          }
          
          // Save results
          fs.writeFileSync('seo-scores.json', JSON.stringify(results, null, 2));
          "

      - name: 📤 Upload SEO scores
        uses: actions/upload-artifact@v4
        with:
          name: seo-scores
          path: seo-scores.json

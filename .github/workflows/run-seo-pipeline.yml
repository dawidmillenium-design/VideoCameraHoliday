name: Run Global SEO Pipeline (DeepSeek)

on:
  workflow_dispatch:
    inputs:
      languages:
        description: 'Comma-separated language codes (e.g., en-US,pl-PL). Leave empty for ALL.'
        required: false
        default: ''
  schedule:
    - cron: '0 2 * * 1'

jobs:
  generate-seo-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Run Global SEO Pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LANGUAGES_INPUT: ${{ github.event.inputs.languages }}
        run: |
          if [ -n "$LANGUAGES_INPUT" ]; then
            echo "Running for specific languages: $LANGUAGES_INPUT"
            python -c "
import os, sys
sys.path.insert(0, '.')
from global_seo_pipeline import GlobalSEOPipeline
languages = [l.strip() for l in os.environ['LANGUAGES_INPUT'].split(',')]
pipeline = GlobalSEOPipeline()
pipeline.run_full_pipeline(languages)
"
          else
            echo "Running for ALL configured languages..."
            python global_seo_pipeline.py
          fi

      - name: Create Pull Request with Generated Content
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-generate SEO content for all languages"
          title: " Multi-Language SEO Content (DeepSeek Pipeline)"
          body: |
            This PR contains SEO-optimized content generated for ALL languages.
            Check the `_posts/` directory for new content.
          branch: "auto-seo-content-${{ github.run_id }}"
          base: "main"
          delete-branch: true
          add-paths: |
            _posts/
            output/

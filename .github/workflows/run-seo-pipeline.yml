name: Run Global SEO Pipeline (DeepSeek)

# Trigger options:
# 1. Manually from the GitHub Actions tab
# 2. Automatically every Monday at 2:00 AM UTC (optional)
on:
  workflow_dispatch:
    inputs:
      languages:
        description: 'Comma-separated language codes (e.g., en-US,pl-PL,th-TH). Leave empty for all.'
        required: false
        default: ''
  schedule:
    - cron: '0 2 * * 1' # Runs every Monday at 2:00 AM UTC

jobs:
  generate-seo-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Run Global SEO Pipeline
        id: run_pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # If languages input is provided, pass it as an argument (requires minor script tweak)
          # Otherwise, it defaults to reading global_seo_crew.yaml
          python global_seo_pipeline.py

      - name: Create Pull Request with Generated Content
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-generate SEO content via DeepSeek pipeline"
          title: "🤖 Auto-Generated SEO Content (DeepSeek Pipeline)"
          body: |
            This PR contains new SEO-optimized content generated by the `global_seo_pipeline.py` script using the DeepSeek API.
            
            **Generated Files:**
            - Check the `output/` directory for new JSON/data files.
            
            **Next Steps:**
            1. Review the generated content and DeepSeek SEO scores.
            2. Merge this PR to deploy the changes to the Jekyll site.
          branch: "auto-seo-content-${{ github.run_id }}"
          base: "main" # Change to "master" if your default branch is master
          delete-branch: true
          add-paths: |
            output/

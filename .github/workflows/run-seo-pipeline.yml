name: Run Global SEO Pipeline

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Type "series" for cities or leave blank for languages'
        required: false
        default: ''
      series_name:
        description: 'Name of series (e.g. invisible_stick_city)'
        required: false
        default: 'invisible_stick_city'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Run Pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.run_mode }}" = "series" ]; then
            echo "Running Series Mode..."
            python global_seo_pipeline.py --series ${{ github.event.inputs.series_name }}
          else
            echo "Running Languages Mode..."
            python global_seo_pipeline.py
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Auto-generated content"
          title: "Auto-Generated Content"
          body: "Check _posts/ for new files."
          branch: "auto-content-${{ github.run_id }}"
          base: "main"
          add-paths: |
            _posts/
            output/

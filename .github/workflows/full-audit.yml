name: Full Site Audit

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * 1' # Every Monday at 8:00 AM UTC

jobs:
  full-audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Node dependencies
        run: npm install cheerio axios

      - name: Run SEO audit
        run: node audit-canonical.js

      - name: Check for critical issues
        run: |
          if grep -q "Critical: [1-9]" audit-summary.txt; then
            echo "❌ Critical issues found:"
            cat audit-summary.txt
            exit 1
          fi

      - name: Run broken link check
        run: |
          npm install -g broken-link-checker
          blc https://dawidmillenium-design.github.io/VideoCameraHoliday/ --recursive --exclude-external --only-4xx > broken-links.txt || true
          if [ -s broken-links.txt ]; then
            echo "⚠️ Broken links found" >> audit-summary.txt
          fi

      - name: Upload full report
        uses: actions/upload-artifact@v4
        with:
          name: full-audit-report
          path: |
            audit-report.json
            audit-summary.txt
            broken-links.txt

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- DYNAMIC SEO TAGS -->
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description }}">
    <link rel="canonical" href="{{ page.canonical_url }}">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ page.description }}">
    <meta property="og:url" content="{{ page.canonical_url }}">
    <meta property="og:type" content="article">
    
    <!-- Paste your massive <style> CSS block right here -->
    <style>
        :root {
            --ocean-blue: #0077b6;
            /* ... rest of your styles ... */
        }
    
/* --- Mobile Menu Styles --- */
.mobile-menu-toggle {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.5rem;
    flex-direction: column;
    gap: 5px;
}
.hamburger-line {
    display: block;
    width: 25px;
    height: 3px;
    background-color: var(--dark);
    border-radius: 2px;
    transition: all 0.3s ease;
}
.mobile-menu-toggle.active .hamburger-line:nth-child(1) { transform: translateY(8px) rotate(45deg); }
.mobile-menu-toggle.active .hamburger-line:nth-child(2) { opacity: 0; }
.mobile-menu-toggle.active .hamburger-line:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

@media (max-width: 768px) {
    .mobile-menu-toggle { display: flex; }
    .mega-menu {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: #fff;
        border-bottom: 1px solid var(--border);
        flex-direction: column;
        padding: 1rem;
        gap: 0;
        box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        max-height: 80vh;
        overflow-y: auto;
    }
    .mega-menu.active { display: flex; }
    .mega-menu > li { padding: 0; border-bottom: 1px solid var(--border); }
    .mega-menu > li > a { display: block; padding: 1rem 0; font-size: 1.1rem; }
    .dropdown {
        position: static;
        transform: none;
        min-width: 100%;
        box-shadow: none;
        border: none;
        padding: 0 0 1rem 1rem;
        grid-template-columns: 1fr;
        opacity: 1;
        visibility: visible;
        display: block;
    }
    .dropdown-col { margin-bottom: 1rem; }
    .dropdown-col h4 { font-size: 0.9rem; margin-top: 0.5rem; }
}
</style>
</head>
<body id="top">

    <!-- This injects the menu -->
    {% include header.html %}

    <!-- This is where the blog post content gets injected -->
    {{ content }}

    <!-- This injects the footer -->
    {% include footer.html %}


<script>
document.addEventListener('DOMContentLoaded', () => {
    const toggleBtn = document.querySelector('.mobile-menu-toggle');
    const mobileMenu = document.querySelector('.mega-menu');
    if (toggleBtn && mobileMenu) {
        toggleBtn.addEventListener('click', () => {
            const isActive = mobileMenu.classList.toggle('active');
            toggleBtn.classList.toggle('active');
            toggleBtn.setAttribute('aria-expanded', isActive);
        });
    }
});
</script>
</body>
</html>
